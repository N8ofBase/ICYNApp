<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="auth.js" defer></script>
<script src="stats.js" defer></script>
<script src="online.js" defer></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120f16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="I Crit You Not">
<title>I Crit You Not!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141218">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Almendra+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: torchlit stone arena on top, the active hero's parchment sheet below (side by side on wide screens). One committed night look. */
:root{
  --night:#141218; --stone:#1f1b25; --stone-2:#2a2531; --line:#3d3546;
  --text:#efe6d6; --muted:#a99fae;
  --parch:#f5ead2; --parch-2:#eadbb8; --ink:#2b2219; --ink-2:#6d5c48;
  --gold:#e0b862; --gold-deep:#a8822a; --good:#3f8f4f; --bad:#b8323f;
  --hero:#7a2232; --hero-ink:#fff;
  --f-display:"Almendra SC","Almendra",Georgia,serif;
  --f-title:"Almendra",Georgia,serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  background:radial-gradient(120% 60% at 50% 0%,#2a2131 0%,var(--night) 60%) fixed,var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em;margin:0;line-height:1;color:var(--gold);text-shadow:0 2px 0 #000}
.logo .mark{width:48px;height:auto;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.logo small{display:block;font-family:var(--f-body);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rounds{display:flex;align-items:center;gap:6px}
.rounds .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.pip{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pip.done{background:var(--stone-2);color:var(--text)}
.pip.now{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 0 12px rgba(224,184,98,.6)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--text)}
.ghost:hover{border-color:var(--gold)}
.top-actions{display:flex;align-items:center;gap:8px}
.acct{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}.acct[hidden]{display:none}
.acct .ghost{padding:5px 12px;font-size:.8rem}.acct b{color:var(--text);font-weight:700;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup-acct{display:flex;justify-content:flex-end;min-height:30px}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.streak.up{background:rgba(224,184,98,.18);color:var(--gold);border:1px solid rgba(224,184,98,.45)}.streak.down{background:rgba(184,50,63,.2);color:#ff9aa4;border:1px solid rgba(184,50,63,.5)}
.over .rec{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;font-size:.85rem;color:var(--muted);min-height:0}.over .rec:empty{display:none}
.over .card.wide{max-width:520px;text-align:left;max-height:86vh;overflow:auto}
.sp-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sp-tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--muted)}
.sp-tabs button[aria-selected="true"]{background:var(--gold);color:#1d1708;border-color:var(--gold);font-weight:800}.sp-tabs .x{margin-left:auto;border:0;font-size:1rem}
.sp-body{display:flex;flex-direction:column;gap:10px}.sp-body h3{margin:4px 0 0;font-family:var(--f-title);color:var(--gold);font-size:1rem}
.sp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.sp-cell{background:var(--stone-2);border-radius:10px;padding:8px;text-align:center}
.sp-cell b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--text)}.sp-cell span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sp-name{display:flex;gap:8px;align-items:end}.sp-name label{flex:1;display:flex;flex-direction:column;gap:3px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sp-name input{font:inherit;font-size:.95rem;letter-spacing:0;text-transform:none;background:var(--stone-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.sp-list,.sp-board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sp-list li,.sp-board li{display:flex;align-items:center;gap:8px;background:var(--stone-2);border-radius:8px;padding:6px 10px;font-size:.86rem}
.sp-list small,.sp-board small{margin-left:auto;color:var(--muted)}.sp-list .r{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.75rem;background:#333}
.sp-list .win .r{background:#2f7a3d}.sp-list .loss .r{background:#8a2430}
.sp-board .rk{width:26px;font-family:var(--f-display);color:var(--gold);text-align:center}.sp-board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp-board li.me{outline:1px solid var(--gold)}
@media (max-width:520px){.top .acct .nm,.top .acct .streak{display:none}.sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.top .acct .su,.top .acct b,.top .acct .nm,.top .acct [data-a="out"]{display:none}.top .acct:not(:has([data-a="out"])) [data-a="stats"]{display:none}}

/* duel layout */
.duel{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.duel>.stagecol,.duel>.sidecol{display:contents}
.duel .arena{order:1}.duel .log{order:2}.duel .sheets{order:3}.duel .rtcard{order:4}
@media (max-width:959px){
  .log{padding:8px 12px}.log h3{margin:0}
  .log .lg-tog{display:flex}
  .log ol{max-height:none;margin-top:6px}
  .log:not(.expanded) ol li:nth-child(n+4){display:none}
  .log.expanded ol{max-height:260px}
}
@media (min-width:960px){
  .duel{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"arena side" "log side" "rt side";grid-template-rows:auto auto 1fr;align-items:start}
  .duel>.sidecol{display:flex;flex-direction:column;gap:14px;grid-area:side;min-width:0;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
  .duel .arena{grid-area:arena}.duel .log{grid-area:log}.duel .rtcard{grid-area:rt}
}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.act-d20{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);width:150px;
  position:absolute;z-index:7;top:4%;left:50%;translate:-50% 0}
.act-d20[hidden]{display:none}
.act-d20{pointer-events:none}.act-d20:not(:disabled) .d20b{pointer-events:auto;cursor:pointer}
.act-d20 .d20b{display:block;width:72px;height:72px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6)) drop-shadow(0 0 14px var(--glow,transparent));transition:transform .15s,filter .2s}
.act-d20 .d20b svg{width:100%;height:100%;display:block;overflow:visible}
.act-d20:not(:disabled) .d20b{animation:beckon 1.4s ease-in-out infinite}
.act-d20:not(:disabled):hover .d20b{animation:none;transform:scale(1.08) rotate(-10deg)}
.act-d20:not(:disabled):active .d20b{transform:scale(.92) rotate(20deg)}
.act-d20:disabled{cursor:default}
.act-d20:disabled{opacity:.8}.act-d20:disabled .d20b{filter:grayscale(.4) brightness(.65)}
.act-d20 .lbl{font-family:var(--f-display);font-size:.9rem;line-height:1.1;text-align:center;background:rgba(12,10,15,.78);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.act-d20 .who{display:block;font-family:var(--f-body);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.act-d20:disabled .lbl{color:var(--muted)}
.sheets{display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet .sh-head{width:100%;border:0;font:inherit;text-align:left;cursor:pointer}
.sheet .sh-head .ttl{min-width:0}
.sh-life{margin-left:auto;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.sh-life b{display:block;font-size:1.5rem;font-weight:800}
.sh-life span{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.sheet .sdie .die{--sz:40px}
.chev{font-size:.9rem;opacity:.8;width:1em;text-align:center}
.sheet.closed{animation:none}
.sheet.closed .sh-head{padding:7px 12px}
.sheet.closed .sh-head img{width:36px;height:36px}
.sheet.closed .sh-head h2{font-size:1.2rem}
.sheet.closed .sh-life b{font-size:1.2rem}
.sheet.closed .sh-body{padding:8px 12px 10px;gap:6px}
.mini-line{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.74rem}
.mini-line>span:first-child{font-weight:800;margin-right:4px}
.mini-line em{font-style:normal;color:var(--bad)}
.pill{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:#fffaf0;border:1px solid var(--parch-2)}
.pill.cd{opacity:.5;text-decoration:line-through}
.rtcard{background:var(--parch);color:var(--ink);border-radius:12px;padding:10px 12px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:0}
.rtcard h3{margin:0 0 6px;font-family:var(--f-title);font-size:1rem;color:var(--ink-2)}
.rt-scroll{padding-top:2px}
.rt2{min-width:0}
.rt2 tbody{border-top:2px solid transparent}
.rt2 tbody+tbody tr:first-child>*{border-top:6px solid transparent;background-clip:padding-box}
.rt2 th.hero{width:64px;text-align:center;vertical-align:middle;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:2px}
.rt2 th.hero img{display:block;width:30px;height:30px;object-fit:contain;margin:0 auto}
.rt2 th.hero span{display:block;font-family:var(--f-title);font-size:.72rem;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.05}
.rt2 th.hero small{display:block;font-size:.55rem;color:var(--ink-2)}
.rt2 th.nowh{color:var(--ink)}
.rt2 td.now{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.rt2 td.first{font-weight:800;background:color-mix(in srgb,var(--c) 22%,#fffaf0)}
.rt2 td.first::before{content:"▲";font-size:.5rem;vertical-align:top;margin-right:1px;color:var(--c)}
.stagecol{display:flex;flex-direction:column;gap:10px;min-width:0}

/* arena */
.arena{position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;border-radius:18px;overflow:hidden;
  background:
   radial-gradient(40% 30% at 8% 6%,rgba(255,170,80,.22),transparent 70%),
   radial-gradient(40% 30% at 92% 6%,rgba(255,170,80,.22),transparent 70%),
   linear-gradient(#231d2b,#17131c 55%,#120f16);
  border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.colo{position:absolute;inset:0;width:100%;height:100%;display:block}
.arena .wall{position:absolute;left:0;right:0;top:0;height:46%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 38px,rgba(0,0,0,.18) 38px 40px),
             repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.22) 22px 24px);
  mask-image:linear-gradient(#000,transparent)}
.torch{position:absolute;top:44%;width:10px;height:26px;border-radius:2px;background:#3a2b1f}
.torch::before{content:"";position:absolute;left:50%;top:-16px;width:16px;height:20px;transform:translateX(-50%);
  border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#fff3c4,#ffb347 45%,rgba(255,90,30,.0) 75%);animation:flick 1.6s infinite alternate}
.torch.l{left:5%}.torch.r{right:5%}
@keyframes flick{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-52%) scale(1.08,.94)}100%{transform:translateX(-48%) scale(.95,1.06)}}
.floor{position:absolute;left:3%;right:3%;bottom:3%;height:44%;border-radius:50%;
  background:radial-gradient(closest-side,#5a4a3a 0%,#40342a 55%,#2b231d 100%);
  box-shadow:0 0 0 3px #1a1510,0 0 0 7px #4a3a2a,0 0 0 9px #1a1510,inset 0 -10px 30px rgba(0,0,0,.5)}
.floor::before{content:"";position:absolute;inset:16% 18%;border-radius:50%;border:2px dashed rgba(224,184,98,.35)}
.floor::after{content:"20";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2.4rem;color:rgba(224,184,98,.14);transform:scaleY(.55)}
.fighter{position:absolute;bottom:6%;width:42%;top:3%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;transition:filter .3s}
.fighter[data-p="0"]{left:2%}.fighter[data-p="1"]{right:2%}
.arena:not(.boss) .fighter[data-p="0"]{left:5%}.arena:not(.boss) .fighter[data-p="1"]{right:5%}
.fighter.dim{filter:saturate(.55) brightness(.72)}
.plate{width:100%;max-width:230px;background:rgba(12,10,15,.78);border:1px solid var(--line);border-radius:10px;padding:5px 8px 6px;cursor:pointer;text-align:left}
.fighter.active .plate{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.plate .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--f-title);font-weight:700;font-size:.95rem;line-height:1.1}
.plate .nm span:last-child{font-family:var(--f-body);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.plate .sbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sb{font-style:normal;font-size:.66rem;font-weight:800;line-height:1.35;padding:1px 7px;letter-spacing:.03em;white-space:pre;border-radius:6px;background:#120f16;color:var(--gold);border:1px solid #e0b862}
.sb.main{background:#e0b862;color:#1d1708}.sb.up{border-color:#7ee08f;color:#9fe3ab}.sb.down{border-color:#ff6b6b;color:#ff9aa4}.sb.main.up{background:#9fe3ab;color:#0f2414}.sb.main.down{background:#ff9aa4;color:#2a0b10}
.hp{height:8px;border-radius:4px;background:#000;margin-top:4px;overflow:hidden;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));transition:width .5s}
.hpn{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.hpn b{color:var(--text);font-weight:800}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;min-height:0}
.chip{font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--stone-2);color:var(--muted)}
.chip.bad{background:rgba(184,50,63,.25);color:#ff9aa4}
.chip.good{background:rgba(63,143,79,.25);color:#9fe3ab}
.figwrap{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.fig{height:calc(var(--scale,1) * 100%);width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(0,0,0,.55));transform-origin:50% 100%;transform:scaleX(var(--sx,1))}
.fighter.alt .fig{filter:drop-shadow(0 10px 8px rgba(0,0,0,.55)) hue-rotate(180deg) saturate(1.15)}
.fighter.active .figwrap::before{content:"";position:absolute;bottom:-4px;left:15%;right:15%;height:18px;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.8}
.fighter[data-p="0"]{--dir:1}.fighter[data-p="1"]{--dir:-1}
.fighter.lunge .fig{animation:lunge .45s}
.fighter.hit .fig{animation:shake .45s}
@keyframes lunge{40%{translate:calc(var(--dir) * 18%) 0;rotate:calc(var(--dir) * 4deg)}}
@keyframes shake{20%{translate:-6px 0;filter:brightness(2) drop-shadow(0 0 8px #f33)}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:3px 0}}
/* action ring */
.ring{position:absolute;top:24%;bottom:2%;width:var(--bs);--bs:40px;z-index:9;pointer-events:none}
.fighter[data-p="0"] .ring{left:0}.fighter[data-p="1"] .ring{right:0}
.rb{position:absolute;width:var(--bs);height:var(--bs);border-radius:50%;padding:0;display:grid;place-items:center;pointer-events:auto;cursor:help;
  --k:calc(1 - (var(--i) - 2) * (var(--i) - 2) / 4);top:calc(var(--i) * (100% - var(--bs)) / 4);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff 10%),color-mix(in srgb,var(--c) 55%,#0b090e));
  border:1.5px solid color-mix(in srgb,var(--c) 40%,#e0b862);color:#fbf1d8;box-shadow:0 3px 8px rgba(0,0,0,.55);transition:transform .15s,box-shadow .2s,opacity .2s;touch-action:manipulation;user-select:none}
.fighter[data-p="0"] .rb{left:calc(var(--k) * -6px)}.fighter[data-p="1"] .rb{right:calc(var(--k) * -6px)}
.fighter[data-p="0"] .rb{transform:translateX(calc((1 - var(--k)) * 14px))}.fighter[data-p="1"] .rb{transform:translateX(calc((1 - var(--k)) * -14px))}
.rb svg{width:58%;height:58%}
.rb.wpn{border-color:#e0b862;border-width:2px}
.rb small{position:absolute;bottom:-7px;left:50%;translate:-50% 0;font-size:.56rem;font-weight:800;background:#120f16;color:var(--gold);border:1px solid #e0b862;border-radius:6px;padding:0 4px;line-height:1.3}
.rb.cd{opacity:.45;filter:grayscale(.8)}.rb.cd::after{content:"";position:absolute;inset:18%;background:linear-gradient(135deg,transparent 46%,#ff9aa4 46% 54%,transparent 54%)}
.rb.broken{border-color:#ff9aa4}.rb.broken svg{color:#ff9aa4}
.rb.pickable{cursor:pointer;box-shadow:0 0 0 2px #fff3c4,0 0 16px 4px var(--c),0 3px 8px rgba(0,0,0,.55);animation:rbpulse 1.1s ease-in-out infinite}
.rb:hover,.rb:focus-visible{z-index:2;outline:none;box-shadow:0 0 0 2px #fff3c4,0 3px 10px rgba(0,0,0,.6)}
@keyframes rbpulse{50%{box-shadow:0 0 0 2px #fff3c4,0 0 26px 8px var(--c),0 3px 8px rgba(0,0,0,.55)}}
.rb.fired{animation:rbfire .6s}
@keyframes rbfire{30%{scale:1.35;box-shadow:0 0 0 3px #fff,0 0 30px 10px var(--c)}}
.fighter.dim .rb{opacity:.75}.fighter.dim .rb.cd{opacity:.35}
#tip{position:fixed;z-index:60;max-width:240px;background:#f4e7c6;color:#2a2017;border:1px solid #c9a76a;border-radius:10px;padding:8px 10px;font-size:.8rem;line-height:1.35;
  box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;opacity:0;translate:0 4px;transition:opacity .12s,translate .12s;display:flex;flex-direction:column;gap:2px}
#tip.on{opacity:1;translate:0 0}#tip.pinned{pointer-events:auto}
#tip .tp-use{margin-top:6px;align-self:stretch;padding:7px 10px;border-radius:8px;border:0;background:#2a2017;color:#fbf1d8;font-family:var(--f-title);font-weight:700;font-size:.95rem;cursor:pointer}#tip .tp-use:hover,#tip .tp-use:focus-visible{background:#5a3f16;outline:none}
#tip b{font-family:var(--f-title);font-size:.98rem}#tip em{font-style:normal;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
#tip .tp-d{font-weight:800}#tip .tp-ok{color:#2f7a3d}#tip .tp-bad{color:#a3202f;font-weight:700}#tip .tp-go{color:#7a5a12;font-weight:800;margin-top:2px}
.notice{position:absolute;left:50%;top:4%;translate:-50% 0;z-index:7;max-width:min(230px,96%);background:rgba(12,10,15,.88);border:1px solid var(--line);border-top:3px solid var(--c);
  border-radius:9px;padding:5px 9px;text-align:center;font-size:.76rem;line-height:1.3;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.5);animation:ntc 3.2s ease forwards}
.notice b{display:block;font-family:var(--f-title);font-size:.9rem}.notice.cal b{color:#ff9aa4}.notice.enh b{color:#9fe3ab}.notice span{color:var(--text)}
@keyframes ntc{0%{opacity:0;translate:-50% 6px}8%{opacity:1;translate:-50% 0}85%{opacity:1}100%{opacity:0}}
@media (max-width:520px){.notice{font-size:.62rem;padding:3px 6px}.notice b{font-size:.74rem}}
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-size:1.6rem;font-weight:700;pointer-events:none;
  text-shadow:0 2px 0 #000,0 0 10px #000;animation:rise 1.4s forwards;white-space:nowrap;z-index:6}
.float.dmg{color:#ff6b6b}.float.heal{color:#7ee08f}.float.stat{font-size:.95rem;font-family:var(--f-body);font-weight:800;color:var(--gold)}
@keyframes rise{0%{opacity:0;translate:0 10px}15%{opacity:1}100%{opacity:0;translate:0 -60px}}

/* dice tray */
.tray{position:absolute;left:24%;right:24%;top:36%;height:30%;display:flex;align-items:center;justify-content:center;gap:4%;z-index:5;pointer-events:none}
.tray .grp{display:flex;gap:6px;align-items:center;justify-content:center}
.tray.pair{left:14%;right:14%;justify-content:space-between}
.die{--sz:clamp(42px,10vw,74px);width:var(--sz);height:var(--sz);position:relative;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6)) drop-shadow(0 0 10px var(--glow,transparent))}
.die.sm{--sz:clamp(32px,7vw,54px)}
.die svg{width:100%;height:100%;display:block;overflow:visible}
.die.rolling{animation:tumble var(--t,900ms) cubic-bezier(.2,.7,.3,1) both}
.die.from1{--fx:60px}.die{--fx:-60px}
@keyframes tumble{0%{transform:translate(var(--fx),-40px) rotate(-600deg) scale(.5);opacity:0}15%{opacity:1}60%{transform:translate(0,4px) rotate(-30deg) scale(1.08)}80%{transform:translate(0,0) rotate(8deg) scale(.97)}100%{transform:none}}
.die.crit{animation:critpulse 1.2s ease-out}
.die.crit::after{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,120,.85),transparent);z-index:-1;animation:burst 1s ease-out forwards}
.die.fumble svg{filter:grayscale(.6) brightness(.7)}
.die.fumble::after{content:"";position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(closest-side,rgba(220,30,40,.7),transparent);z-index:-1;animation:burst 1s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes critpulse{30%{transform:scale(1.25)}}

/* banner */
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8}
.banner span{font-family:var(--f-display);font-size:clamp(1.6rem,6.5vw,3rem);color:var(--gold);text-shadow:0 3px 0 #000,0 0 24px rgba(255,190,90,.8);
  padding:.15em .6em;background:linear-gradient(90deg,transparent,rgba(10,8,12,.85) 15%,rgba(10,8,12,.85) 85%,transparent);animation:slam 1.6s forwards;white-space:nowrap}
.banner.cal span{color:#ff7a84;text-shadow:0 3px 0 #000,0 0 24px rgba(255,60,70,.8)}
.banner.luck span{color:#bfe8ff;text-shadow:0 3px 0 #000,0 0 24px rgba(120,200,255,.8)}
@keyframes slam{0%{transform:scale(2.2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* readout + action */
.readout{position:absolute;left:50%;bottom:10px;translate:-50% 0;z-index:6;max-width:calc(100% - 120px);background:rgba(12,10,15,.8);border:1px solid var(--line);border-left:3px solid var(--hero,var(--gold));border-radius:8px;padding:4px 10px;display:flex;gap:8px;align-items:baseline;font-size:.82rem;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .k{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:none}
.readout .v{overflow:hidden;text-overflow:ellipsis}
.readout .v{font-weight:700;font-variant-numeric:tabular-nums}
.readout .v em{font-style:normal;color:var(--gold)}
.readout .v .hit{color:#9fe3ab}.readout .v .miss{color:#ff9aa4}
.act{width:100%;padding:14px 18px;border-radius:14px;border:0;font-family:var(--f-display);font-size:1.25rem;letter-spacing:.03em;
  background:linear-gradient(180deg,color-mix(in srgb,var(--hero) 82%,#fff),var(--hero));color:var(--hero-ink);
  box-shadow:0 4px 0 color-mix(in srgb,var(--hero) 55%,#000),0 8px 20px rgba(0,0,0,.4);transition:transform .08s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--hero) 55%,#000)}
.act:disabled{opacity:.6;cursor:default}
.act .who{display:block;font-family:var(--f-body);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85}

/* sheet */
.sheet{background:var(--parch);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);min-width:0;animation:sheetin .45s ease-out}
@keyframes sheetin{from{transform:translateY(14px);opacity:.3}}
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--hero);color:var(--hero-ink)}
.sh-head img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.sh-head h2{font-family:var(--f-title);font-weight:700;font-size:1.6rem;margin:0;line-height:1}
.sh-head .sub{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.sh-head .dset{margin-left:auto;display:flex;align-items:center;gap:6px;text-align:right;font-size:.72rem;line-height:1.2}
.sh-head .dset .die{--sz:40px}
.sh-head .turnflag{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.28);padding:2px 6px;border-radius:4px}
.sh-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.sec{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 4px}
.stats{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-variant-numeric:tabular-nums}
.stats th{background:var(--hero);color:var(--hero-ink);font-family:var(--f-title);font-weight:700;font-size:.72rem;padding:5px 1px;border-radius:5px;position:relative;line-height:1.1}
.stats th.rowh{background:transparent;color:var(--ink-2);font-family:var(--f-body);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;width:44px;text-align:left}
.stats td{background:#fffaf0;border:1px solid var(--parch-2);border-radius:5px;text-align:center;font-weight:800;font-size:1.02rem;padding:4px 0}
.stats td.up{color:var(--good);background:#eaf6e8}.stats td.down{color:var(--bad);background:#fbe9ea}
.stats tr.start td{font-weight:500;color:var(--ink-2);font-size:.85rem;background:transparent}
.ribbon{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:linear-gradient(var(--gold),var(--gold-deep));color:var(--ink);font-family:var(--f-body);font-size:.55rem;font-weight:800;letter-spacing:.1em;padding:1px 5px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.weapon{display:flex;align-items:center;gap:10px;background:#fffaf0;border:1px solid var(--parch-2);border-radius:8px;padding:8px 10px}
.weapon .f{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.weapon .n{font-size:.78rem;color:var(--ink-2);line-height:1.25}
.weapon .broken{margin-left:auto;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--bad);padding:2px 6px;border-radius:4px}
.abil{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{position:relative;text-align:left;border:1px solid var(--parch-2);border-left:5px solid var(--hero);background:#fffaf0;border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
.ab b{display:block;font-family:var(--f-title);font-size:1rem;line-height:1.1}
.ab .d{font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
.ab .e{font-size:.74rem;color:var(--ink-2);line-height:1.2;min-height:1.2em}
.ab .st{position:absolute;top:6px;right:8px;font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.ab.cd{opacity:.5;background:repeating-linear-gradient(135deg,#f0e4c8 0 6px,#e8d9b6 6px 12px)}
.ab.cd .st{color:var(--bad)}
.ab.pickable{cursor:pointer;animation:glowab 1.4s infinite}
.ab.pickable:hover{transform:translateY(-1px);background:#fff}
@keyframes glowab{50%{box-shadow:0 0 0 2px var(--hero),0 0 14px color-mix(in srgb,var(--hero) 50%,transparent)}}
.rt{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;font-variant-numeric:tabular-nums;font-size:.8rem}
.rt th{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:800}
.rt th.rowh{text-align:left;width:40px}
.rt td{text-align:center;background:#fffaf0;border:1px solid var(--parch-2);border-radius:4px;height:22px;font-weight:700}
.rt td.now{border-color:var(--hero);box-shadow:inset 0 0 0 1px var(--hero)}
.rt td.x{color:var(--ink-2);background:transparent}
.rt td.n1{color:var(--bad)}.rt td.n20{color:var(--good)}
.peek{font-size:.74rem;color:var(--ink-2);text-align:center}

/* round table tips */
.rt td.tip{position:relative;cursor:help;text-decoration:underline dotted;text-underline-offset:2px}
.rt td.tip:hover::after,.rt td.tip:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:20;
  width:max-content;max-width:200px;white-space:normal;text-align:left;font-size:.74rem;font-weight:600;line-height:1.25;padding:6px 8px;border-radius:6px;
  background:var(--ink);color:var(--parch);box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:none}
.rt tr td.tip:nth-child(-n+3):hover::after,.rt tr td.tip:nth-child(-n+3):focus::after{left:0;transform:none}
.rt tr td.tip:nth-last-child(-n+2):hover::after,.rt tr td.tip:nth-last-child(-n+2):focus::after{left:auto;right:0;transform:none}
.sheet,.rival{overflow:visible}.sh-head{border-radius:14px 14px 0 0}.rv-head{border-radius:12px 12px 0 0}

/* rival panel */
.rival{background:var(--parch);color:var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:0}
.rv-head{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--hero);color:var(--hero-ink)}
.rv-head img{width:30px;height:30px;object-fit:contain}
.rv-head b{font-family:var(--f-title);font-size:1.05rem}
.rv-head .k{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.rv-head .w{margin-left:auto;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rv-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.rv-ab{display:flex;flex-wrap:wrap;gap:4px}
.rv-ab span{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:999px;background:#fffaf0;border:1px solid var(--parch-2)}
.rv-ab span.cd{opacity:.5;text-decoration:line-through}
.stats.mini td{font-size:.9rem;padding:2px 0}.stats.mini tr.start td{font-size:.74rem}.stats.mini th{font-size:.62rem;padding:3px 1px}

/* calamity & enhancement scroll */
.scroll-ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(8,6,10,.62);
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.scroll{width:min(600px,100%);max-height:100%;display:flex;flex-direction:column;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));animation:unroll .55s cubic-bezier(.2,.8,.2,1) both}
.rod{flex:none;height:18px;border-radius:9px;margin:0 -8px;position:relative;z-index:1;background:linear-gradient(#a06a35,#6a4019 55%,#3d240c);box-shadow:0 3px 5px rgba(0,0,0,.45)}
.rod::before,.rod::after{content:"";position:absolute;top:-3px;width:14px;height:24px;border-radius:5px;background:linear-gradient(#e7c27a,#9a7330)}
.rod::before{left:-8px}.rod::after{right:-8px}
.paper{flex:1;min-height:0;overflow:auto;background:radial-gradient(120% 80% at 50% 50%,var(--parch) 55%,#e2cc9c 100%);color:var(--ink);padding:10px 16px 0;box-shadow:inset 0 10px 14px -10px rgba(60,30,0,.5),inset 0 -10px 14px -10px rgba(60,30,0,.5)}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.scroll-ov.closing{animation:fadein .45s reverse forwards}
.scroll-ov.closing .scroll{animation:rollup .45s forwards}
@keyframes rollup{to{clip-path:inset(0 0 100% 0)}}
.sc-head{text-align:center;padding-bottom:6px}
.sc-head .k{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sc-head h2{margin:0;font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.scroll.cal .sc-head h2{color:#8e2430}.scroll.enh .sc-head h2{color:#2f6b3a}
.faces{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px 12px}
@media (min-width:560px){.faces{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:column;grid-template-rows:repeat(10,auto)}}
.faces li{display:flex;gap:8px;align-items:baseline;padding:3px 8px;border-radius:5px;font-size:.84rem;line-height:1.2;transition:background .08s,transform .2s}
.faces li:nth-child(odd){background:rgba(90,60,20,.06)}
.faces li b{flex:none;width:1.6em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.faces li.flick{background:color-mix(in srgb,var(--hero) 28%,transparent)}
.faces li.picked{background:var(--hero);color:var(--hero-ink);transform:scale(1.04);box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.3);animation:picked 1s ease-out}
.faces li.picked b{color:inherit}
@keyframes picked{0%{transform:scale(1.25)}100%{transform:scale(1.04)}}
.sc-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0 12px;background:linear-gradient(transparent,var(--parch) 28%)}
.sc-die{background:none;border:0;padding:4px;border-radius:50%}
.sc-die .die{--sz:76px}
.sc-die:not(:disabled){animation:beckon 1.4s ease-in-out infinite;cursor:pointer}
@keyframes beckon{50%{transform:translateY(-5px) rotate(-6deg)}}
.sc-hint{font-family:var(--f-title);font-size:1.05rem;min-width:9em}
.sc-hint b{font-family:var(--f-display);font-size:1.3rem}

/* scroll reveal: the chosen result fills the scroll before it rolls up */
.scroll{position:relative}
.reveal{position:absolute;inset:18px 0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--hero) 80%,#fff),var(--hero));color:var(--hero-ink);
  box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 40px rgba(0,0,0,.35);animation:revealin .45s cubic-bezier(.2,.8,.2,1) both}
.rv-n{font-family:var(--f-display);font-size:clamp(4rem,22vw,7rem);line-height:.9;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.rv-k{font-size:.8rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.rv-t{font-family:var(--f-title);font-size:clamp(1.3rem,5vw,1.9rem);line-height:1.15;max-width:18ch;text-wrap:balance}
@keyframes revealin{from{clip-path:inset(46% 4% 46% 4% round 8px);opacity:.6}to{clip-path:inset(0 0 0 0 round 0);opacity:1}}

/* lore */
.lore{margin:0;max-width:65ch;font-size:.82rem;color:var(--ink-2);border-top:1px solid var(--parch-2);padding-top:8px}

/* chronicle */
.log{background:var(--stone);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.log h3{margin:0 0 6px;font-family:var(--f-title);font-size:1rem;color:var(--gold)}
.lg-tog{display:none;width:100%;justify-content:space-between;align-items:baseline;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.lg-tog small{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:959px){.lg-ttl{display:none}}
.log ol{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.log li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.log li i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));translate:0 -1px}
.log li b{color:var(--text);font-weight:700}
.log li.rnd{color:var(--gold);font-family:var(--f-title);margin-top:4px}

/* setup */
.setup{display:flex;flex-direction:column;gap:16px;max-width:980px;margin:0 auto;width:100%}
.hero-intro{text-align:center;padding:8px 0 0}
.hero-intro .brand{display:block;margin:0 auto;width:clamp(200px,44vw,320px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.hero-intro h1{font-family:var(--f-display);font-size:clamp(2.2rem,8vw,3.6rem);margin:0;color:var(--gold);line-height:1;text-shadow:0 3px 0 #000,0 0 30px rgba(224,184,98,.25)}
.hero-intro p{margin:8px auto 0;max-width:56ch;color:var(--muted)}
.mode{display:flex;justify-content:center;gap:0;background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;margin:0 auto}
.mode button{border:0;background:transparent;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:700}
.mode button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px}
.opt>span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opt .mode button{padding:6px 12px;font-size:.85rem}
.pickers{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.pickers{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center}}
.side h3{margin:0 0 8px;font-family:var(--f-title);font-size:1.1rem;display:flex;justify-content:space-between;align-items:baseline}
.side h3 span{font-family:var(--f-body);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pick{border:1px solid var(--line);background:var(--stone);border-radius:10px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-width:0}
.pick img{height:calc(64px * var(--sc,1));margin-top:calc(64px * (1 - var(--sc,1)));width:100%;object-fit:contain;object-position:50% 100%}
.pick .race{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick span{font-family:var(--f-title);font-size:.78rem;line-height:1.1;text-align:center}
.pick[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 30%,var(--stone));box-shadow:0 0 0 1px var(--c)}
.chosen{margin-top:8px;display:flex;gap:10px;align-items:center;background:var(--stone);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;min-height:76px}
.chosen .die{--sz:46px}
.chosen .t{min-width:0}
.chosen .t b{font-family:var(--f-title);font-size:1.05rem}
.chosen .t div{font-size:.8rem;color:var(--muted)}

// ---------- Online duels (server referees every roll; we animate its events) ----------
const NET = {you:0,players:[],events:[],used:new Set(),waiters:[],game:null,fastUntil:0,pendingSince:0,pendingP:null};
const NET_INFO = new Set(['start','round','turn','first','sitOut','allCooldown','repaired']);
function netFeed(game){
  NET.game=game;NET.events=game.events||[];NET.players=game.players||NET.players;
  const pend=game.pending;NET.pendingP=pend?pend.p:null;
  NET.pendingSince=pend&&game.pendingSince?(typeof game.pendingSince==='number'?game.pendingSince:Date.parse(game.pendingSince)):0;
  const w=NET.waiters;NET.waiters=[];w.forEach(f=>f());
}
const netWake=()=>new Promise(r=>NET.waiters.push(r));
// first unread event of a type (informational events are never waited on)
function netFind(type){for(let i=0;i<NET.events.length;i++)if(!NET.used.has(i)&&NET.events[i].t===type)return i;return -1}
const netFresh=()=>NET.events.some((e,i)=>!NET.used.has(i)&&!NET_INFO.has(e.t));
async function netNext(type,t){
  for(;;){const i=netFind(type);if(i>=0){NET.used.add(i);if(REDUCED&&!REDUCED_PREF&&i>=NET.fastUntil-1)REDUCED=false;return NET.events[i]}
    await netWake();if(t!==undefined)chk(t)}
}
async function netArrived(t){while(!netFresh()){await netWake();chk(t)}}

  let seed=7;const rr=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const qy=(y,t)=>(1-t)*(1-t)*(y+30)+2*(1-t)*t*(y-30)+t*t*(y+30), qx=t=>(1-t)*(1-t)*-20+2*(1-t)*t*200+t*t*420;
  const band=(y1,y2)=>`M-20 ${y1+30} Q200 ${y1-30} 420 ${y1+30} L420 ${y2+30} Q200 ${y2-30} -20 ${y2+30}Z`;
  const tiers=[[30,66,'#4b3d33',.55],[66,106,'#5a493c',.75],[106,146,'#6b5746',1]];

    const seatH=(y2-y1)*.42;
    for(let row=0;row<2;row++){const n=Math.round(46/sc);for(let i=0;i<n;i++){const t=(i+rr()*.6)/n,x=qx(t),y=qy(y1+5+row*seatH*.45,t)+rr()*2;

// Arena view (default): the arena fills the screen; Hero sheets + Round Table open from the name plates
let LAYOUT='arena';try{LAYOUT=localStorage.getItem('icyn.layout')||'arena'}catch(e){}
// phones keep the stacked layout (user 2026-10-25); the full-screen arena is for desktop-size screens
// the installed app (Add to Home Screen) also gets it on phones held sideways
const APP=matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone===true;
const BIG=matchMedia('(min-width:900px) and (min-height:560px), (display-mode: fullscreen) and (orientation: landscape), (display-mode: standalone) and (orientation: landscape)');
const fullView=()=>LAYOUT!=='classic'&&BIG.matches;
function setLayout(v){LAYOUT=v;try{localStorage.setItem('icyn.layout',v)}catch(e){}applyLayout()}
// switch layouts in place (rebuilding the shell would drop the Chronicle and any pending roll)
function applyLayout(){const d=$('.duel:not(.boss)');if(!d)return;const full=fullView();
  document.body.classList.toggle('arena-full',full);d.classList.toggle('full',full);if(!full)d.classList.remove('sheets-open');

  const home=full?d.querySelector('.sidecol'):d.querySelector('.stagecol');[d.querySelector('.log'),d.querySelector('.rtcard')].forEach(el=>el&&home.append(el));
  $('#tolayout').textContent=full?'Show tables beside the arena':'Full-screen arena';$('#tolayout').hidden=!BIG.matches}

function chooseAbility(p,t){

    const fromServer=()=>netArrived(t).then(()=>{const i=netFind('damage');return i>=0?NET.events[i].i:0});
    if(p!==NET.you){setAct(p,rivalName()+' · '+f.h.name,'Choosing an Ability…',false);return fromServer()}
    if(netFresh())return fromServer();

    return Promise.race([new Promise(res=>{S._pickResolve=i=>{netAct('ability',i);res(i)}}),fromServer()])
      .then(i=>{S.choosing=false;S._pickResolve=null;chk(t);renderSheet();return i});}
  const f=S.F[p];const btn=$('#act');setHero(btn,f.skin);
  if(isCPU(p)){setAct(p,'Computer · '+f.h.name,'Choosing an Ability…',false);
    let best=-1,bi=0;f.abilities.forEach((a,i)=>{if(a.cd)return;let v=a.dice*3.5+f[a.stat]+(a.debuff?2.5:0)+(a.heal?Math.min(healAmt(f,a),f.maxLife-f.life):0)+Math.random();if(v>best){best=v;bi=i}});

// ---------- Dice rolling ----------
// groups: [{p, sides:[20|6,...], forced?:[values]}]; returns arrays of values per group
async function rollGroups(groups,t){
  const tray=$('#tray');tray.innerHTML='';tray.className='tray'+(groups.length>1?' pair':'');
  const many=groups.reduce((n,g)=>n+g.sides.length,0)>2;
  const res=groups.map(g=>g.sides.map((s,i)=>g.forced?.[i]??rnd(s)));
  const els=[];
  groups.forEach((g,gi)=>{const wrap=document.createElement('div');wrap.className='grp';
    g.sides.forEach((s,i)=>{const el=dieEl(g.skin||S.F[g.p].skin,s,rnd(s),(many?'sm ':'')+'rolling'+((S.mode==='boss'?g.p==='boss':g.p===1)?' from1':''));
      el.style.setProperty('--t',(REDUCED?50:800+i*120)+'ms');wrap.append(el);els.push({el,g,s,v:res[gi][i]})});tray.append(wrap)});
  const dur=REDUCED?60:800+(Math.max(...groups.map(g=>g.sides.length))-1)*120;
  const start=performance.now();
  await new Promise(r=>{const tick=()=>{const done=performance.now()-start>=dur;
      for(const d of els){if(done||Math.random()<.5)d.el.innerHTML=(d.s===20?d20svg:d6svg)(d.g.skin||S.F[d.g.p].skin,done?d.v:rnd(d.s))}
      if(done)r();else setTimeout(tick,70)};tick()});
  chk(t);
  for(const d of els){d.el.classList.remove('rolling');if(d.s===20&&d.v===20)d.el.classList.add('crit');if(d.s===20&&d.v===1)d.el.classList.add('fumble')}
  await sleep(REDUCED?50:250);chk(t);
  return res;
}
const roll=(p,sides,t,forced)=>rollGroups([{p,sides,forced}],t).then(r=>r[0]);

async function applyEffects(p,list,t){
  const f=S.F[p],notes=[];
  for(const e of list){
    switch(e[0]){
      case 'lifeloss':{const before=f.life;f.life=Math.max(1,f.life-e[1]);floatText(p,'−'+(before-f.life),'dmg');anim(p,'hit');notes.push(`-${before-f.life} Life`);break}
      case 'half':{const before=f.life;f.life=Math.ceil(f.life/2);floatText(p,'−'+(before-f.life),'dmg');anim(p,'hit');notes.push(`Life halved to ${f.life}`);break}
      case 'all':for(const s of STATS)f[s]=Math.max(0,f[s]+e[1]);floatText(p,`All Stats ${e[1]>0?'+':''}${e[1]}`,'stat');notes.push(`All Stats ${e[1]>0?'+':''}${e[1]}`);break;
      case 'main':changeStat(p,f.h.main,e[1]);notes.push(`${SN[f.h.main]} ${e[1]>0?'+':''}${e[1]}`);break;
      case 'stat':changeStat(p,e[1],e[2]);notes.push(`${SN[e[1]]} ${e[2]>0?'+':''}${e[2]}`);break;
      case 'broken':{const was=f.broken;f.broken=true;f.brokenUntil=S.round+1;const until=f.brokenUntil>8?'for the rest of the duel':`through round ${f.brokenUntil}`;notes.push(was?`Weapon stays broken ${until}`:`Weapon Broken ${until}`);floatText(p,'Weapon broken','stat');break}
      case 'rcd':{renderAll();const i=await randomAbility(p,t);const a=f.abilities[i];
        if(a.cd)notes.push(`${a.name} already on cooldown`);else{a.cd=true;notes.push(`${a.name} on cooldown`)}break}
      case 'maxlife':f.maxLife+=e[1];f.life+=e[1];floatText(p,'+'+e[1],'heal');notes.push(`+${e[1]} Max & Life`);break;
      case 'life':{const g=heal(p,e[1]);notes.push(`+${g} Life`);break}
      case 'full':{const g=heal(p,f.maxLife);notes.push(`Full Life (+${g})`);break}
      case 'clear':f.abilities.forEach(a=>a.cd=false);notes.push('Cooldowns cleared');break;
      case 'weapon':{const fixed=f.broken;f.broken=false;f.weaponDice++;notes.push(`${fixed?'Weapon repaired and ':'Weapon '}now ${f.weaponDice}D6`);break}
      case 'rai':{const hadCd=f.abilities.some(a=>a.cd);f.abilities.forEach(a=>a.cd=false);renderAll();const i=await randomAbility(p,t);const a=f.abilities[i];a.dice++;notes.push(`${a.name} now ${a.dice}D6`+(hadCd?', all cooldowns cleared':''));break}
    }

  }

}

async function tableRoll(p,kind,t,record){

async function luckOff(a,b,t,reason){
  banner('Luck Off!','luck');log(`Tie on ${reason}. Luck Off!`,null);
  for(;;){
    await ask(a,'Luck Off!',t,'both');
    const lv=S.mode==='online'?(await netNext('luck',t)).rolls:null;
    const [[x],[y]]=await rollGroups([{p:0,sides:[20],forced:lv&&[lv[0]]},{p:1,sides:[20],forced:lv&&[lv[1]]}],t);
    const vals={0:x,1:y};
    readout('Luck Off',`${S.F[0].h.name} <em>${x}</em> vs ${S.F[1].h.name} <em>${y}</em>`);
    if(x!==y){const w=x>y?0:1;log(`<b>${S.F[w].h.name}</b> wins the Luck Off (${vals[w]} vs ${vals[1-w]})`,w);await sleep(500);chk(t);return w}
    log('Luck Off tied again. Roll again!',null);
  }
}
async function speedRoll(t){
  S.active=null;renderAll();
  const btnP = S.mode==='cpu'?0:0;
  await ask(btnP,`Roll for Speed · Round ${S.round}`,t,'both');
  const sv=S.mode==='online'?(await netNext('speed',t)).nat:null;
  const [[a],[b]]=await rollGroups([{p:0,sides:[20],forced:sv&&[sv[0]]},{p:1,sides:[20],forced:sv&&[sv[1]]}],t);
  const nat=[a,b],tot=[a+S.F[0].speed,b+S.F[1].speed];
  S.F.forEach((f,i)=>{f.table[S.round-1].speed=tot[i]});
  readout('Speed',`${S.F[0].h.name} ${a} + ${S.F[0].speed} = <em>${tot[0]}</em> · ${S.F[1].h.name} ${b} + ${S.F[1].speed} = <em>${tot[1]}</em>`);
  log(`Speed: ${S.F[0].h.name} ${tot[0]}, ${S.F[1].h.name} ${tot[1]}`,null);
  renderAll();await sleep(REDUCED?100:700);chk(t);
  // natural 1s and 20s on Speed
  const skip=[false,false];
  for(const i of [0,1]){
    if(nat[i]===1){banner('Calamity!','cal');readout(`${S.F[i].h.name} · Speed`,'Natural <em>1</em>. Calamity, and this round\'s turn is lost.');
      log(`<b>${S.F[i].h.name}</b> rolls a natural 1 for Speed and loses this turn`,i);
      await tableRoll(i,'cal',t,false);skip[i]=true;if(over())return null}
    if(nat[i]===20){banner('I Crit You Not!');readout(`${S.F[i].h.name} · Speed`,'Natural <em>20</em>. Enhancement before acting.');
      await tableRoll(i,'enh',t,false)}
  }
  let first;
  if(nat[0]===1&&nat[1]!==1)first=1;else if(nat[1]===1&&nat[0]!==1)first=0;
  else if(nat[0]===20&&nat[1]!==20)first=0;else if(nat[1]===20&&nat[0]!==20)first=1;
  else if(tot[0]!==tot[1])first=tot[0]>tot[1]?0:1;
  else first=await luckOff(0,1,t,'Speed');
  log(`<b>${S.F[first].h.name}</b> strikes first`,first);
  return {first,skip};
}
async function weaponAttack(p,label,t){
  const f=S.F[p],r=S.F[1-p],q=1-p;
  await ask(p,label,t,'weapon');
  flashRing(p,'w');anim(p,'lunge');
  const av=S.mode==='online'?await netNext('attack',t):null;
  const [d]=await roll(p,[20],t,av&&[av.d]);
  if(d===1){
    banner('Calamity!','cal');readout(`${f.h.name} · ${label}`,`Natural <em>1</em>. Calamity, and the turn ends.`);
    log(`<b>${f.h.name}</b> rolls a natural 1 on the attack!`,p);

  }
  let hit=false,max=false,rollTxt='natural 20';
  if(d===20){
    banner('I Crit You Not!');readout(`${f.h.name} · ${label}`,`Natural <em>20</em>! Enhancement, then MAX damage.`);
    log(`<b>${f.h.name}</b> rolls a natural 20!`,p);
    await tableRoll(p,'enh',t,false);hit=true;max=true;
  }else{
    const bonus=f.broken?0:f[f.h.main],tot=d+bonus;rollTxt=`${tot} vs DEF ${r.def}`;
    if(tot>r.def)hit=true;else if(tot===r.def){readout(`${f.h.name} · ${label}`,`${d} + ${bonus} = <em>${tot}</em> vs DEF ${r.def} · Tie!`);hit=(await luckOff(p,q,t,'the attack'))===p;if(S.mode==='online')await netNext('attack',t)}
    readout(`${f.h.name} · ${label}`,`${d} + ${bonus} = <em>${tot}</em> vs DEF ${r.def} · <span class="${hit?'hit':'miss'}">${hit?'Hit':'Miss'}</span>`);
    if(!hit){log(`<b>${f.h.name}</b> attacks: ${tot} vs DEF ${r.def}, miss`,p);await sleep(REDUCED?100:650);chk(t);return 'ok'}
    await sleep(REDUCED?50:450);chk(t);
  }
  const bonus=f.broken?0:f[f.h.main];
  let dmg;const dv=S.mode==='online'?await netNext('damage',t):null;
  if(max){dmg=f.weaponDice*6+bonus;await roll(p,Array(f.weaponDice).fill(6),t,Array(f.weaponDice).fill(6))}
  else{const vs=await roll(p,Array(dv?dv.dice.length:f.weaponDice).fill(6),t,dv&&dv.dice);dmg=vs.reduce((a,b)=>a+b,0)+bonus}
  dmg=dv?dv.dmg:Math.max(0,dmg);
  readout(`${f.h.name} · Weapon damage`,`${f.weaponDice}D6 + ${bonus} = <em>${dmg}</em>${max?' (MAX)':''}`);
  damage(q,dmg);if(dv)netSnap(dv.F);log(`<b>${f.h.name}</b> attacks: ${rollTxt}, hits for <b>${dmg}</b>${max?' (max damage)':''}`,p);
  await sleep(REDUCED?100:700);chk(t);return 'ok';
}

// ---------- Online lobby (online.js: create/join by code, server referees) ----------
const NETUI={phase:'idle',code:null,err:'',busy:false};
const heroId=h=>HEROES[h]?h:(ORDER.find(id=>HEROES[id].name===h)||'brawler');
function toast(msg){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),4000)}
function netCall(fn){NETUI.err='';NETUI.busy=true;renderNetBox();Promise.resolve().then(fn).catch(e=>{NETUI.busy=false;NETUI.err=(e&&e.message)||'Could not reach the arena';renderNetBox()})}
function renderNetBox(){const el=$('#netbox');if(!el)return;const O=window.ICYNOnline;
  const err=NETUI.err?`<p class="nb-err" role="alert">${esc(NETUI.err)}</p>`:'';
  if(!signedIn()){el.innerHTML=`<p>Sign in to duel a friend on another device. Every roll is made by the arena, so nobody can cheat.</p><div class="row"><button class="act" id="nb-in">Sign in</button><button class="ghost" id="nb-up">Create account</button></div>${err}`;
    el.querySelector('#nb-in').onclick=()=>ICYNAuth.signIn();el.querySelector('#nb-up').onclick=()=>ICYNAuth.signUp();return}
  if(NETUI.phase==='waiting'){el.innerHTML=`<p>Share this code with your rival:</p><div class="nb-code" aria-label="Duel code">${esc(NETUI.code||'')}</div>
      <div class="row"><button class="ghost" id="nb-copy">Copy code</button><button class="ghost" id="nb-cancel">Cancel</button></div><p class="nb-wait">Waiting for them to join…</p>${err}`;
    el.querySelector('#nb-copy').onclick=()=>{try{navigator.clipboard.writeText(NETUI.code);el.querySelector('#nb-copy').textContent='Copied'}catch(e){}};
    el.querySelector('#nb-cancel').onclick=()=>{O.close();NETUI.phase='idle';NETUI.code=null;renderNetBox()};return}
  const saved=O.savedGame();
  el.innerHTML=`${saved?'<button class="act" id="nb-re"><span class="who">A duel is still open</span>Rejoin your duel</button>':''}
    <button class="act begin" id="nb-create" ${NETUI.busy?'disabled':''}><span class="who">${esc(HEROES[S.picks[0]].name)} · ${S.life} Life</span>Create online duel</button>
    <div class="nb-join"><label for="nb-code">Or join a friend’s duel</label><div class="row"><input id="nb-code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE"><button class="ghost" id="nb-join" ${NETUI.busy?'disabled':''}>Join</button></div><small>The duel’s creator sets the Starting Life.</small></div>${err}`;
  if(saved)el.querySelector('#nb-re').onclick=()=>netCall(()=>O.resume(saved));
  el.querySelector('#nb-create').onclick=()=>netCall(()=>O.create(S.picks[0],S.life));
  const join=()=>{const c=el.querySelector('#nb-code').value.trim().toUpperCase();if(c.length<5){NETUI.err='Enter the 5 letter code';renderNetBox();return}netCall(()=>O.join(c,S.picks[0]))};
  el.querySelector('#nb-join').onclick=join;el.querySelector('#nb-code').onkeydown=e=>{if(e.key==='Enter')join()};
}
function netInit(){if(!window.ICYNOnline||netInit.done)return;netInit.done=true;
  ICYNOnline.onError(e=>{NETUI.busy=false;NETUI.err=e;if(S.screen==='setup')renderNetBox();else toast(e)});
  ICYNOnline.onState(onNetState);
  setInterval(netNudgeCheck,1000);
  if(S.screen==='setup'&&$('#m-net'))renderSetup();
}
function onNetState(game){if(!game)return;NETUI.busy=false;
  if(game.status==='waiting'){NETUI.phase='waiting';NETUI.code=game.code;if(S.screen==='setup'){if(S.mode!=='online'){S.mode='online';renderSetup()}else renderNetBox()}return}
  const inDuel=S.mode==='online'&&S.screen==='duel'&&NET.gameId===game.gameId;
  if(inDuel){netFeed(game);if(game.status==='done'&&!NET.ended&&!(game.events||[]).some(e=>e.t==='end'))netForfeitEnd(game);return}
  if(game.status==='active')return startOnlineDuel(game);
  NETUI.phase='idle';NETUI.err='That duel has already ended.';if(S.screen==='setup')renderNetBox();
}
function startOnlineDuel(game){
  S.token++;const t=S.token;
  document.querySelectorAll('.over,.scroll-ov').forEach(o=>o.remove());
  Object.assign(NET,{you:game.you,gameId:game.gameId,used:new Set(),waiters:[],ended:false,fastUntil:0});
  netFeed(game);NETUI.phase='idle';
  const st=NET.events.find(e=>e.t==='start');
  S.mode='online';S.picks=game.players.map(x=>heroId(x.hero));if(st&&st.setup)S.life=Number(st.setup.life)||S.life;
  // back mid-duel (reload or a second device): replay what already happened at speed
  let last=-1;NET.events.forEach((e,i)=>{if(!NET_INFO.has(e.t))last=i});
  if(last>=0){NET.fastUntil=last+1;REDUCED=true}
  S.F=S.picks.map((id,p)=>makeFighter(id,p));S.round=1;S.active=null;S.view=NET.you;S.choosing=false;S.screen='duel';S.first=[];S.lastRound=1;
  renderDuelShell();
  log(`<b>${S.F[0].h.name}</b> faces <b>${S.F[1].h.name}</b> online. Crit happens.`,null);
  duel(t).then(()=>{NET.ended=true}).catch(e=>{if(e!==ABORT)console.error(e)});
  const iv=setInterval(()=>{if(t!==S.token)return clearInterval(iv);if(S.round<=8)S.lastRound=S.round},200);
}
function netForfeitEnd(game){NET.ended=true;S.token++;REDUCED=REDUCED_PREF;S.lastRound=Math.min(8,Math.max(1,S.round));
  document.querySelectorAll('.scroll-ov').forEach(o=>o.remove());
  const r=game.result||{};S.active=null;renderAll();setAct(NET.you,'Duel over','Forfeit',false);
  showEnd(r.winner===undefined?NET.you:r.winner,true)}
// a rival who sits on a prompt for 45 s can be nudged: the arena plays it for them
function netNudgeCheck(){const b=$('#nudge');if(!b)return;
  const g=NET.game,wait=S.mode==='online'&&S.screen==='duel'&&g&&g.status==='active'&&g.pending&&NET.pendingP!==null&&NET.pendingP!==NET.you&&NET.pendingSince&&Date.now()-NET.pendingSince>45000;
  b.hidden=!wait;b.onclick=()=>{b.hidden=true;try{ICYNOnline.nudge()}catch(e){};toast('Nudged. The arena will make their move.')}}
function startDuel(){
  S.token++;const t=S.token;
  document.querySelectorAll('.over,.scroll-ov').forEach(o=>o.remove());
  S.F=S.picks.map((id,p)=>makeFighter(id,p));S.round=1;S.active=null;S.view=0;S.choosing=false;S.screen='duel';S.first=[];
  renderDuelShell();
  log(`<b>${S.F[0].h.name}</b> faces <b>${S.F[1].h.name}</b>. Crit happens.`,null);
  duel(t).catch(e=>{if(e!==ABORT)console.error(e)});
  // track round of a KO for the end card
  const iv=setInterval(()=>{if(t!==S.token)return clearInterval(iv);if(S.round<=8)S.lastRound=S.round},200);
}

function renderBossFighters(){
  S.F.forEach((f,p)=>{f.peakMax=Math.max(f.peakMax||0,f.maxLife);const el=$(`.fighter[data-p="${p}"]`);if(!el)return;
    el.classList.toggle('active',S.active===p);el.classList.toggle('dim',typeof S.active==='number'&&S.active!==p);
    el.classList.toggle('fallen',f.life<=0);el.classList.toggle('afraid',!!f.afraid&&f.life>0);
    el.querySelector('.tag').innerHTML=`<b><span>${f.h.name}</span><span>${f.life<=0?'Fallen':f.afraid?'Afraid':f.life}</span></b><div class="hp"><i style="width:${Math.max(0,Math.min(100,f.life/f.maxLife*100))}%"></i></div>`});
  const B=S.boss,el=$('.fighter[data-p="boss"]');if(!el)return;
  el.classList.toggle('active',S.active==='boss');el.classList.toggle('fallen',B.life<=0);
  el.querySelector('.plate').innerHTML=`<div class="nm"><span>Starvos</span><span>Catastrophe</span></div><div class="sbs">${svStatBubbles(B)}</div><div class="hp"><i style="width:${Math.max(0,B.life/B.maxLife*100)}%"></i></div>
    <div class="hpn"><span><b>${B.life}</b> / ${B.maxLife}</span><span>R${Math.min(8,S.round)}: ${svAbility(Math.min(8,Math.max(1,S.round))).name}</span></div>`;
  renderBossBar();
}
// The acting Hero's Weapon and Abilities sit in a bar under the arena (five Heroes leave no room for rings)
function renderBossBar(){const el=$('#bossbar');if(!el)return;const p=S.active;
  if(typeof p!=='number'||!S.F[p]){el.style.removeProperty('--c');
    el.innerHTML=`<div class="bb-who">${p==='boss'?`<img src="${IMG.starvos}" alt=""><span><small>Starvos</small><b>${svAbility(Math.min(8,S.round)).name}</b></span>`:`<span><small>Round ${Math.min(8,Math.max(1,S.round))}</small><b>${S.round>8?'The battle is over':'All Heroes'}</b></span>`}</div>`;return}
  const f=S.F[p];el.style.setProperty('--c',f.color);
  const wPick=S.asking&&S.asking.p===p&&S.asking.kind==='weapon';
  const btn=(k,ic,cls,pick)=>`<button class="rb ${cls} ${pick?'pickable':''}" data-k="${k}" aria-label="${k==='w'?'Weapon Strike':esc(f.abilities[k].name)}">${icon(ic)}<small>${k==='w'?f.weaponDice:f.abilities[k].dice}D6</small></button>`;
  el.innerHTML=`<div class="bb-who"><img src="${IMG[f.id]}" alt=""><span><small>On turn</small><b>${f.h.name}</b></span></div>
    <div class="bb-acts">${btn('w',f.h.wicon,'wpn'+(f.broken?' broken':''),wPick)+f.abilities.map((a,i)=>btn(i,a.icon,a.cd?'cd':'',S.choosing&&!a.cd)).join('')}</div>`;
  el.querySelectorAll('.rb').forEach(b=>wireRb(b,p,f));
}
function starvosSheetHTML(){const B=S.boss,open=S.view==='boss';
  const head=`<button class="sh-head" data-p="boss" aria-expanded="${open}"><img src="${IMG.starvos}" alt=""><div class="ttl"><div class="sub">The Catastrophe${S.active==='boss'?' <span class="turnflag">Striking</span>':''}</div><h2>Starvos</h2></div>
    <div class="sh-life"><b>${B.life}</b><span>/ ${B.maxLife} Life</span></div><span class="chev" aria-hidden="true">${open?'▾':'▸'}</span></button>`;
  const cols=STATS,dc=k=>{const d=B[k]-STARVOS.stats[k];return d>0?'up':d<0?'down':''};
  const table=`<table class="stats mini"><tr><th class="rowh"></th>${cols.map(k=>`<th>${SHORT[k]}</th>`).join('')}</tr><tr><th class="rowh">Now</th>${cols.map(k=>`<td class="${dc(k)}">${B[k]}</td>`).join('')}</tr></table>`;
  if(!open)return `<div class="sheet closed sv" data-p="boss">${head}<div class="sh-body">${table}</div></div>`;
  return `<div class="sheet open sv" data-p="boss">${head}<div class="sh-body"><div><p class="sec">Stat Table</p>${table}</div>
    <div><p class="sec">Abilities by round · never misses</p><ol class="sv-rounds">${STARVOS.rounds.map((k,i)=>{const a=STARVOS.abilities[k];
      return `<li class="${i+1===S.round?'now':i+1<S.round?'done':''}" style="--ac:${a.col}"><b>${i+1}</b><span>${a.name}</span><small>${svEffect(a)} (${B[a.stat]})</small></li>`}).join('')}</ol></div>
    <p class="lore">If Starvos still lives after round 8, he unleashes Annihilate and destroys the planet.</p></div></div>`}
function renderBossSheets(){
  const w=$('#sheets');if(!w||!S.F.length)return;
  w.innerHTML=starvosSheetHTML()+S.F.map((f,p)=>sheetHTML(p)).join('');
  w.querySelectorAll('.sheet').forEach(el=>setHero(el,el.dataset.p==='boss'?'starvos':S.F[+el.dataset.p].skin));
  w.querySelectorAll('.sdie').forEach(el=>el.append(dieEl(S.F[+el.dataset.p].skin,20,20)));
  w.querySelectorAll('.sh-head').forEach(b=>b.onclick=()=>{const p=b.dataset.p==='boss'?'boss':+b.dataset.p;if(S.view!==p){S.view=p;renderSheet()}});
  if(S.choosing)w.querySelectorAll('.ab.pickable').forEach(b=>b.onclick=()=>{S.choosing=false;S._pickResolve&&S._pickResolve(+b.dataset.i)});
  const rt=$('#roundtable');if(rt)rt.innerHTML=roundTableHTML();
  renderBossBar();
}
function starvosRoundRow(){return `<tbody style="--c:${SKIN.starvos.color}"><tr><th class="hero"><img src="${IMG.starvos}" alt=""><span>Starvos</span></th><th class="rowh">Atk</th>${STARVOS.rounds.map((k,i)=>{const a=STARVOS.abilities[k];
  return `<td class="sv-atk ${i+1===S.round?'now':''}" style="--ac:${a.col}" title="${esc(a.name+': '+svEffect(a))}">${a.short}</td>`}).join('')}</tr></tbody>`}

// ---------- Boss mode flow ----------
function bossHit(n){const B=S.boss;B.life=Math.max(0,B.life-n);floatText('boss','−'+n,'dmg');anim('boss','hit');renderAll()}
function heroHurt(p,n){const f=S.F[p];damage(p,n);if(f.life<=0){log(`<b>${f.h.name}</b> has fallen!`,p,'cal');floatText(p,'Fallen','stat')}}
async function fearWave(t){
  S.active=null;renderAll();banner('Fear Wave','cal');anim('boss','lunge');
  readout('Starvos · Fear Wave',`Each Hero rolls D20 + Charm. ${STARVOS.fear} or less: 1D6 damage and the round is lost.`);
  log('<b>Starvos</b> unleashes a <b>Fear Wave</b>','boss');
  await sleep(REDUCED?100:900);chk(t);
  const ps=standing();
  await ask(ps[0],'Stand against the Fear Wave',t,'both');
  const res=await rollGroups(ps.map(p=>({p,sides:[20]})),t);
  const afraid=[];
  ps.forEach((p,i)=>{const f=S.F[p],v=res[i][0],tot=v+f.charm;f.table[S.round-1].fear=tot;
    if(v===1||(v!==20&&tot<=STARVOS.fear)){afraid.push(p);f.afraid=true;f.table[S.round-1].afraid=true}});
  readout('Fear Wave',ps.map((p,i)=>`${S.F[p].h.name} <em>${res[i][0]+S.F[p].charm}</em>`).join(' · '));
  log('Fear Wave: '+ps.map((p,i)=>`${S.F[p].h.name} ${res[i][0]}+${S.F[p].charm}=${res[i][0]+S.F[p].charm}`).join(', '),null);
  renderAll();await sleep(REDUCED?100:900);chk(t);
  for(const [i,p] of ps.entries()){const v=res[i][0],f=S.F[p];
    if(v===1){banner('Calamity!','cal');readout(`${f.h.name} · Fear Wave`,'Natural <em>1</em>. Calamity, and the round is lost.');log(`<b>${f.h.name}</b> rolls a natural 1 against the Fear Wave`,p);await tableRoll(p,'cal',t,false)}
    if(v===20){banner('I Crit You Not!');readout(`${f.h.name} · Fear Wave`,'Natural <em>20</em>. Fearless, and an Enhancement!');await tableRoll(p,'enh',t,false)}}
  if(!afraid.length){log('Every Hero stands firm against the fear.',null);return}
  readout('Fear Wave',`${afraid.map(p=>S.F[p].h.name).join(', ')} ${afraid.length>1?'are':'is'} overcome: 1D6 damage each`);
  const dmg=await rollGroups(afraid.map(p=>({p:'boss',skin:'starvos',sides:[6]})),t);
  afraid.forEach((p,i)=>{heroHurt(p,dmg[i][0]);log(`<b>${S.F[p].h.name}</b> is gripped by fear: ${dmg[i][0]} damage, sits out this round`,p)});
  renderAll();await sleep(REDUCED?100:800);chk(t);
}
// Claw Strike and Bite: every standing Hero rolls a plain D20 and the lowest takes the blow (tied lowest roll again)
async function randomTarget(t){
  let ps=standing();if(ps.length===1)return ps[0];
  await ask(ps[0],'Roll to dodge',t,'both');
  for(;;){
    const res=await rollGroups(ps.map(p=>({p,sides:[20]})),t);
    const lo=Math.min(...res.map(r=>r[0])),low=ps.filter((p,i)=>res[i][0]===lo);
    readout('Dodge',ps.map((p,i)=>`${S.F[p].h.name} <em>${res[i][0]}</em>`).join(' · '));
    await sleep(REDUCED?100:700);chk(t);
    if(low.length===1){log(`Dodge rolls: ${ps.map((p,i)=>`${S.F[p].h.name} ${res[i][0]}`).join(', ')}. <b>${S.F[low[0]].h.name}</b> is caught`,low[0]);return low[0]}
    log(`${low.map(p=>S.F[p].h.name).join(', ').replace(/, ([^,]*)$/,' and $1')} tie for lowest. Roll again!`,null);ps=low;
    await ask(ps[0],'Tie! Roll to dodge again',t,'both');
  }
}
async function starvosStrike(t){
  const a=svAbility(S.round),B=S.boss;
  S.active='boss';S.view='boss';renderAll();banner(a.name,'cal');anim('boss','lunge');
  readout(`Starvos · ${a.name}`,`${svEffect(a)} (${B[a.stat]})`);log(`<b>Starvos</b> uses <b>${a.name}</b>: ${svEffect(a).toLowerCase()} (${B[a.stat]})`,'boss');
  await sleep(REDUCED?100:1100);chk(t);
  const targets=a.all?standing():[await randomTarget(t)];
  await ask(targets[0],`Roll ${a.name} damage`,t,'both');
  const res=await rollGroups(targets.map(p=>({p,sides:Array(a.dice).fill(a.sides)})),t);
  const parts=targets.map((p,i)=>{const d=res[i].reduce((x,y)=>x+y,0)+B[a.stat];heroHurt(p,d);return `${S.F[p].h.name} −${d}`});
  readout(`Starvos · ${a.name}`,parts.join(' · '));log(`${a.name} hits: ${parts.join(', ')}`,'boss');
  renderAll();await sleep(REDUCED?100:1000);chk(t);
}
async function bossSpeed(t){
  const ps=standing().filter(p=>!S.F[p].afraid);if(!ps.length)return {order:[],acted:[]};
  S.active=null;renderAll();
  await ask(ps[0],`Roll for Speed · Round ${S.round}`,t,'both');
  const res=await rollGroups(ps.map(p=>({p,sides:[20]})),t);
  const nat={},tot={},tie={};
  ps.forEach((p,i)=>{nat[p]=res[i][0];tot[p]=nat[p]+S.F[p].speed;tie[p]=Math.random();S.F[p].table[S.round-1].speed=tot[p]});
  readout('Speed',ps.map(p=>`${S.F[p].h.name} <em>${tot[p]}</em>`).join(' · '));
  renderAll();await sleep(REDUCED?100:700);chk(t);
  const lost=new Set();
  for(const p of ps){const f=S.F[p];
    if(nat[p]===1){banner('Calamity!','cal');readout(`${f.h.name} · Speed`,'Natural <em>1</em>. Calamity, and this round\'s turn is lost.');log(`<b>${f.h.name}</b> rolls a natural 1 for Speed and loses this turn`,p);await tableRoll(p,'cal',t,false);lost.add(p)}
    if(nat[p]===20){banner('I Crit You Not!');readout(`${f.h.name} · Speed`,'Natural <em>20</em>. Enhancement before acting.');await tableRoll(p,'enh',t,false)}}
  // natural 20s act first; otherwise highest Speed (teammates break ties at random)
  const key=p=>(nat[p]===20?1000:0)+tot[p]+tie[p]/10;
  const order=ps.filter(p=>!lost.has(p)).sort((x,y)=>key(y)-key(x));
  if(order.length)log('Turn order: '+order.map(p=>`${S.F[p].h.name} (${tot[p]})`).join(', '),null);
  return {order,acted:ps};
}
async function bossWeapon(p,label,t){
  const f=S.F[p],B=S.boss;
  await ask(p,label,t,'weapon');
  flashRing(p,'w');anim(p,'lunge');
  const [d]=await roll(p,[20],t);
  if(d===1){banner('Calamity!','cal');readout(`${f.h.name} · ${label}`,`Natural <em>1</em>. Calamity, and the turn ends.`);
    log(`<b>${f.h.name}</b> rolls a natural 1 on the attack!`,p);await tableRoll(p,'cal',t,false);return 'end'}
  let max=false,rollTxt='natural 20';
  if(d===20){banner('I Crit You Not!');readout(`${f.h.name} · ${label}`,`Natural <em>20</em>! Enhancement, then MAX damage.`);
    log(`<b>${f.h.name}</b> rolls a natural 20!`,p);await tableRoll(p,'enh',t,false);max=true}
  else{const bonus=f.broken?0:f[f.h.main],tot=d+bonus,hit=tot>=B.def;rollTxt=`${tot} vs DEF ${B.def}${tot===B.def?' (ties go to the Heroes)':''}`;
    readout(`${f.h.name} · ${label}`,`${d} + ${bonus} = <em>${tot}</em> vs DEF ${B.def} · <span class="${hit?'hit':'miss'}">${hit?'Hit':'Miss'}</span>`);
    if(!hit){log(`<b>${f.h.name}</b> attacks Starvos: ${tot} vs DEF ${B.def}, miss`,p);await sleep(REDUCED?100:650);chk(t);return 'ok'}
    await sleep(REDUCED?50:450);chk(t)}
  const bonus=f.broken?0:f[f.h.main];let dmg;
  if(max){dmg=f.weaponDice*6+bonus;await roll(p,Array(f.weaponDice).fill(6),t,Array(f.weaponDice).fill(6))}
  else{const vs=await roll(p,Array(f.weaponDice).fill(6),t);dmg=vs.reduce((a,b)=>a+b,0)+bonus}
  readout(`${f.h.name} · Weapon damage`,`${f.weaponDice}D6 + ${bonus} = <em>${dmg}</em>${max?' (MAX)':''}`);
  bossHit(dmg);log(`<b>${f.h.name}</b> attacks Starvos: ${rollTxt}, hits for <b>${dmg}</b>${max?' (max damage)':''}`,p);
  await sleep(REDUCED?100:700);chk(t);return 'ok';
}
async function bossAbility(p,i,t){
  const f=S.F[p],a=f.abilities[i],B=S.boss;
  flashRing(p,i);a.cd=true;renderSheet();anim(p,'lunge');
  const vs=await roll(p,Array(a.dice).fill(6),t);
  const dmg=Math.max(0,vs.reduce((x,y)=>x+y,0)+f[a.stat]);
  readout(`${f.h.name} · ${a.name}`,`${a.dice}D6 + ${cap(a.stat)} ${f[a.stat]} = <em>${dmg}</em>${a.debuff?` · Starvos ${cap(a.debuff)} −1`:''}`);
  bossHit(dmg);
  const extra=[];
  if(a.debuff&&B[a.debuff]>0){B[a.debuff]--;floatText('boss',`${SN[a.debuff]} −1`,'stat');extra.push(`Starvos ${cap(a.debuff)} −1`)}
  if(a.heal){let r=0;for(let k=0;k<a.heal;k++)r+=rnd(6);const g=heal(p,r);extra.push(`heals ${g} (rolled ${r})`)}
  log(`<b>${f.h.name}</b> uses ${a.name} on Starvos for <b>${dmg}</b>${extra.length?' · '+extra.join(', '):''}`,p);
  renderAll();await sleep(REDUCED?100:800);chk(t);
}
async function bossTurn(p,t){
  const f=S.F[p];setActive(p);banner('');
  readout(`${f.h.name}'s turn`,'Strike at Starvos!');
  await sleep(REDUCED?100:500);chk(t);
  const res=await bossWeapon(p,'Weapon Attack',t);if(res==='end'||bossDown())return;
  if(f.abilities.some(a=>!a.cd)){const i=await chooseAbility(p,t);await bossAbility(p,i,t)}
  else{log(`All of ${f.h.name}'s Abilities are on cooldown: second Weapon Attack`,p);await bossWeapon(p,'Second Weapon Attack',t)}
}
// End of round: the Heroes who stood firm roll their Enhancements together (one D20 each), results shown over each Hero
async function bossEnhancements(ps,t){
  if(!ps.length)return;
  S.active=null;renderAll();banner('');
  readout(`End of Round ${S.round}`,'Heroes who stood firm roll for an Enhancement.');
  await ask(ps[0],'Roll Enhancements',t,'both');
  const res=await rollGroups(ps.map(p=>({p,sides:[20]})),t);
  for(const [i,p] of ps.entries()){const f=S.F[p],v=res[i][0],list=tables().ENH[v];
    f.table[S.round-1].enh=v;S.active=p;renderAll();
    readout(`${f.h.name} · Enhancement`,`<em>${v}</em> · ${list.length?list.map(e=>effText(e,f)).join('; '):'No Enhancement'}`);
    const notes=await applyEffects(p,list,t),r=notes.length?notes.join(', '):'no Enhancement';
    log(`<b>${f.h.name}</b> Enhancement ${v}: ${r}`,p);notice(p,'enh',`Enhancement ${v}`,r);
    await sleep(REDUCED?100:list.length?1100:500);chk(t)}
  S.active=null;renderAll();
}
async function catastrophe(t){
  for(S.round=1;S.round<=8;S.round++){
    const li=document.createElement('li');li.className='rnd';li.textContent=`Round ${S.round}`;$('#log').prepend(li);
    S.F.forEach(f=>f.afraid=false);renderAll();
    await fearWave(t);if(heroesDown())break;
    await starvosStrike(t);if(heroesDown())break;
    const sp=await bossSpeed(t);S.first[S.round-1]=sp.order[0];renderSheet();
    for(const p of sp.order){if(S.F[p].life<=0)continue;await bossTurn(p,t);if(bossDown())break}
    if(bossDown())break;
    for(const f of S.F)if(f.broken&&S.round>=f.brokenUntil){f.broken=false;log(`<b>${f.h.name}</b>'s weapon is repaired`,f.p)}
    if(S.round<8)await bossEnhancements(sp.acted.filter(p=>S.F[p].life>0),t);
  }
  S.lastRound=Math.min(8,S.round);
  const result=bossDown()?'win':heroesDown()?'fallen':'annihilate';
  S.F.forEach(f=>f.afraid=false);S.active=result==='annihilate'?'boss':null;renderAll();
  if(result==='annihilate'){banner('Annihilate','cal');readout('Starvos · Annihilate','Starvos survives round 8 and destroys the planet.');
    log('<b>Starvos</b> survives the eighth round and unleashes <b>Annihilate</b>. The planet is destroyed.','boss','cal');
    $('#arena').classList.add('annihilate');await sleep(REDUCED?200:2600);chk(t)}
  else if(result==='win'){banner('Starvos Falls!');log(`<b>Starvos</b> falls in round ${S.lastRound}. The planet is saved!`,'boss');$('.fighter[data-p="boss"]').classList.add('slain');await sleep(REDUCED?200:1800);chk(t)}
  else{banner('All Heroes have fallen','cal');log('All Heroes have fallen. Starvos feasts on the planet.','boss','cal');await sleep(REDUCED?200:1800);chk(t)}
  S.round=9;S.active=null;renderAll();showBossEnd(result);
}
function showBossEnd(result){
  document.querySelectorAll('.over:not(.sp)').forEach(o=>o.remove());
  const win=result==='win',up=standing().map(p=>S.F[p]);
  const o=document.createElement('div');o.className='over sv-end '+result;setHero(o,win&&up[0]?up[0].skin:'starvos');
  o.innerHTML=`<div class="card"><img src="${IMG.starvos}" alt="" class="${win?'slain':''}"><h2>${win?'The Planet Is Saved':result==='fallen'?'The Heroes Have Fallen':'The Planet Is Lost'}</h2>
    <p><b style="color:var(--text)">${win?'Victory!':'Defeat'}</b> ${win?`Starvos falls in round ${S.lastRound}.`:result==='fallen'?`Every Hero fell in round ${S.lastRound}.`:'Starvos survived 8 rounds and unleashed Annihilate.'}</p>
    <p>${win?`${up.length} of ${S.F.length} Hero${S.F.length>1?'es':''} still standing`:`Starvos had ${S.boss.life} of ${S.boss.maxLife} Life left`}</p>
    <div class="sv-party">${S.F.map(f=>`<span class="${f.life>0?'':'down'}" style="--c:${f.color}"><img src="${IMG[f.id]}" alt="">${f.h.name}<b>${f.life>0?f.life:'Fallen'}</b></span>`).join('')}</div>
    <div class="row"><button class="act" id="rematch">Face Starvos again</button><button class="ghost" id="newd">New game</button></div></div>`;
  document.body.append(o);
  o.querySelector('#rematch').onclick=()=>{o.remove();startCatastrophe()};
  o.querySelector('#newd').onclick=()=>{o.remove();S.token++;S.screen='setup';renderSetup()};
}
function startCatastrophe(){
  S.token++;const t=S.token;
  document.querySelectorAll('.over,.scroll-ov').forEach(o=>o.remove());
  // makeFighter reads skins from S.picks and Life from S.life (the duel settings); the party never repeats a Hero, so each keeps its own colors
  const keep=[S.picks,S.life];S.picks=S.party.slice();S.life=STARVOS.heroLife;S.F=S.party.map((id,p)=>makeFighter(id,p));[S.picks,S.life]=keep;
  const L=bossLife();S.boss={life:L,maxLife:L,...STARVOS.stats};
  S.round=1;S.active=null;S.view=0;S.choosing=false;S.screen='duel';S.first=[];S.lastRound=1;
  renderBossShell();
  log(`<b>Starvos</b> descends on the planet with ${L} Life. ${S.F.length>1?S.F.map(f=>f.h.name).join(', ').replace(/, ([^,]*)$/,' and $1')+' stand':S.F[0].h.name+' stands'} against him.`,'boss');
  catastrophe(t).catch(e=>{if(e!==ABORT)console.error(e)});
}

buildDefs();renderSetup();
</script>

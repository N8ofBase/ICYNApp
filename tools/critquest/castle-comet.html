<title>Castle Comet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+SC:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the Comet from above, as Project Lightbringer tells it. The Courtyard with the Teleportation Station's
   circle of crystals is the middle; rooms sit on plots around it, some built, some open for you to build.
   One night-sky look on purpose (the castle rides a comet through space). */
:root {
  color-scheme: dark;
  --void: #0c0f1f; --hall: #171c35; --stone: #262c4d; --line: #3b4370;
  --ink: #ede7d6; --soft: #a8a6bd;
  --comet: #f0c04f; --ember: #e2714b; --frost: #82cbd9; --leaf: #8fc274; --water: #3f7fa6;
  --display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { min-height: 100%; }
body {
  background: var(--void); color: var(--ink); font-family: var(--body); font-size: 16px; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--comet); outline-offset: 2px; }
.note { color: var(--soft); font-size: .9rem; margin: 0; }

/* top bar */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.top h1 { font-size: 2rem; letter-spacing: .04em; color: var(--comet); }
.top .sub { color: var(--soft); font-size: .95rem; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pouch { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
.pouch span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--hall); font-size: .85rem; white-space: nowrap; }
.pouch b { color: var(--comet); font-weight: 700; }
.styleChip { padding: 3px 9px; border: 1px solid var(--comet); border-radius: 12px; background: var(--hall); font-size: .85rem; color: var(--comet); cursor: pointer; }

/* hub */
.hub { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .hub { grid-template-columns: minmax(0, 1fr); } }
.ringWrap { max-width: 560px; width: 100%; margin: 0 auto; }
.ringWrap svg { display: block; width: 100%; height: auto; user-select: none; touch-action: manipulation; }
.plot { cursor: pointer; }
.plot:focus { outline: none; }
.plot circle.face { fill: var(--stone); stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 6; transition: fill .2s; }
.plot.built circle.face { fill: #3a3150; stroke: var(--comet); stroke-dasharray: none; }
.plot.buildable circle.face { stroke: var(--comet); }
.plot:hover circle.face, .plot:focus-visible circle.face { fill: #4a3f2c; }
.plot:focus-visible circle.face { stroke: var(--frost); stroke-width: 3; }
.plot text { font-family: var(--display); font-size: 17px; text-anchor: middle; fill: var(--soft); pointer-events: none; }
.plot.built text { fill: var(--ink); }
.plot.buildable text { fill: var(--comet); }
.path { stroke: var(--line); stroke-width: 10; stroke-linecap: round; }
.path.built { stroke: #4a4060; }
.yard { fill: #1d2240; stroke: var(--comet); stroke-width: 2; cursor: pointer; }
.yard:hover { fill: #252a4d; }
.yardText { font-family: var(--display); fill: var(--comet); text-anchor: middle; pointer-events: none; }
.crystal { fill: var(--frost); opacity: .9; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .crystals { animation: pulse 3.2s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }

.panel { background: var(--hall); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: 1.3rem; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.roomList { display: grid; gap: 6px; }
.roomList button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--stone); cursor: pointer; }
.roomList button:hover { border-color: var(--comet); }
.roomList small { color: var(--soft); }
.tag { font-size: .72rem; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--comet); color: var(--comet); white-space: nowrap; }
.tag.dim { border-color: var(--line); color: var(--soft); }
.journal { margin: 0; padding-left: 18px; color: var(--soft); font-size: .9rem; display: grid; gap: 4px; }
.warm { color: var(--leaf); font-size: .9rem; margin: 0; }

/* hall view (side-scrolling) */
.viewToggle .btn { padding: 6px 12px; font-size: .9rem; }
.hallWrap { height: 380px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #1b1f3a; }
@media (max-width: 600px) { .hallWrap { height: 300px; } }
#hall { width: 100%; height: 100%; display: block; touch-action: manipulation; user-select: none; }
.hdoor { cursor: pointer; }
.hdoor:hover path { filter: brightness(1.2); }
.sign { font-family: var(--display); font-size: 17px; fill: var(--comet); text-anchor: middle; }
.signSub { font-family: var(--body); font-size: 13px; fill: var(--soft); text-anchor: middle; }
.promptT { font-family: var(--body); font-weight: 700; font-size: 14px; fill: var(--void); text-anchor: middle; }
@media (prefers-reduced-motion: no-preference) { .flame { animation: flick 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } }
@keyframes flick { 50% { transform: scaleY(.8); opacity: .8; } }
.hallCtl { align-items: center; }

/* satchel and item icons */
img.mini { width: 20px; height: 20px; vertical-align: -5px; margin-right: 4px; object-fit: contain; }
.sgroup { border: 1px solid var(--line); border-radius: 6px; background: var(--stone); }
.sgroup summary { cursor: pointer; padding: 7px 10px; font-weight: 500; }
.sgroup summary small { color: var(--soft); font-weight: 400; margin-left: 6px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; padding: 0 8px 8px; }
.slot { position: relative; display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 8px; background: radial-gradient(circle at 50% 40%, #f6ecd2, #d9c69c); color: #2b1d10; }
.slot img { width: 44px; height: 44px; object-fit: contain; }
.slot b { position: absolute; top: 3px; right: 6px; font-size: .8rem; font-variant-numeric: tabular-nums; }
.slot span { font-size: .72rem; text-align: center; line-height: 1.1; }
.slot.none { opacity: .38; }
.slot.locked { background: var(--hall); border: 1px dashed var(--line); color: var(--soft); }
.slot.locked img { filter: brightness(0) invert(.25); opacity: .7; }
.demo { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.demo .btn { font-size: .85rem; padding: 6px 10px; }
.need { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .85rem; color: var(--soft); }
.need .short { color: var(--ember); }
.seeds small { margin-left: 4px; }
.loadout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 12px; }
.gslot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; background: var(--hall); }
.loadForm { display: grid; gap: 10px; margin: 12px 0; }
.loadForm label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.loadForm select { font: inherit; padding: 5px 8px; border-radius: 6px; max-width: 100%; background: var(--stone); color: var(--ink); border: 1px solid var(--line); }
.slot.empty { background: var(--hall); border: 1px dashed var(--line); color: var(--soft); min-height: 66px; align-content: center; }
.packSlots { padding: 6px 0 12px; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
.warn { color: var(--ember); }
.title { padding: 22px; } .title.center { text-align: center; justify-items: center; }
.big { font-family: var(--display); font-size: clamp(1.9rem, 5vw, 2.8rem); color: var(--comet); margin: 0; font-weight: 400; }
.sub2 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; margin: 0; color: var(--frost); }
.lead { max-width: 62ch; line-height: 1.5; margin: 0; }
.pickGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pickGrid.sm { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.pickGrid.feat { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.pickCard { text-align: left; display: grid; gap: 3px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--stone); color: var(--ink); cursor: pointer; font: inherit; }
.pickCard small { color: var(--soft); font-size: .8rem; line-height: 1.3; }
.pickCard.on { border-color: var(--comet); box-shadow: inset 0 0 0 1px var(--comet); background: #2f2a3c; }
.pickCard:hover { border-color: var(--soft); }
.eyebrow small { text-transform: none; letter-spacing: 0; margin-left: 6px; color: var(--soft); font-size: .8rem; }
.avatar { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
.avForm { display: grid; gap: 10px; min-width: 0; }
.avSheet { position: sticky; top: 12px; display: grid; gap: 8px; justify-items: start; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--void); }
.avSheet h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
.avSheet p { margin: 0; }
@media (max-width: 760px) { .avatar { grid-template-columns: minmax(0, 1fr); } .avSheet { position: static; } }
.d20.big { width: 84px; height: 84px; font-size: 2rem; }
.statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: .9rem; color: var(--soft); width: 100%; }
.statGrid b { color: var(--ink); }
.focusGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.focusGrid > div { display: grid; gap: 6px; align-content: start; }
.fname { font-family: var(--display); color: var(--frost); }
.diceRow { display: flex; flex-wrap: wrap; gap: 6px; }
.diceRow .brk { flex-basis: 100%; height: 0; }
.chip2 { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--stone); color: var(--ink); font: inherit; font-size: .85rem; cursor: pointer; }
.chip2.on { border-color: var(--comet); box-shadow: inset 0 0 0 1px var(--comet); }
.chip2.lock { opacity: .75; border-style: dashed; }
.chip2 small { color: var(--comet); }
.sw { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-style: normal; font-size: 9px; font-weight: 700; }
.tableWrap { overflow-x: auto; }
.ctable { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 520px; }
.ctable th, .ctable td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ctable th { color: var(--soft); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.ctable td.ok { color: var(--leaf); } .ctable td.pickme { color: var(--comet); }
.secGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.secCard { display: grid; gap: 8px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--stone); }
.secCard small { color: var(--soft); }
.slot .ico { font-size: 1.4rem; line-height: 1.4; }
.bstats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-variant-numeric: tabular-nums; color: var(--soft); }
.bstats b { color: var(--ink); }
.bwrap { position: relative; max-width: 640px; width: 100%; }
.bwrap svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.hex.bale { fill: #c9a36b; cursor: default; }
.hex.lit { fill: #2f4a3a; stroke: var(--leaf); }
.tokT { font-family: var(--display); font-size: 20px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.turnPop { position: absolute; z-index: 5; transform: translate(-50%, 34px); width: 220px; display: grid; gap: 3px; padding: 8px; border-radius: 10px;
  background: #f3e6c8; color: #2b1d10; border: 2px solid #c99a3c; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.turnPop .popHead { font-family: "Alegreya SC", Georgia, serif; font-weight: 700; color: #7a2e1c; font-size: .95rem; }
.turnPop button { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; text-align: left; font: inherit; font-size: .92rem; color: #2b1d10; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 7px; cursor: pointer; }
.turnPop button:hover:not(:disabled) { background: #fff4d8; border-color: #8a6a3a; }
.turnPop button:disabled { opacity: .45; cursor: default; }
.turnPop small { color: #5a4630; font-size: .78rem; }
@media (max-width: 560px) { .turnPop { position: static; transform: none; width: auto; margin-top: 8px; } }
.arena.full { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; z-index: 60; }
.arena { width: 100%; height: min(1180px, 160vh); border: 0; border-radius: 8px; background: var(--void); display: block; }
.nextStep { border: 1px solid var(--comet); border-radius: 8px; padding: 10px 12px; background: #2a2540; }
.nextStep b { color: var(--comet); }


/* room */
.room { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: start; }
.room.solo { grid-template-columns: minmax(0, 1fr); }
.scene .hot, .hdoor { cursor: pointer; }
.scene .hot:focus, .hdoor:focus { outline: none; }
.hl { fill: transparent; stroke: none; opacity: 0; pointer-events: none; transition: opacity .2s; }
.hot:hover .hl, .hot:focus-visible .hl, .hdoor:hover .hl { fill: url(#auraG); opacity: 1; }
@media (max-height: 520px) {
  .hud { flex-wrap: nowrap !important; max-height: 84px; overflow: hidden; } .sec { width: auto !important; } .hud .sec:first-child { display: none; }
  .sec h4 { display: none; } .hud .pouch { flex-wrap: nowrap; overflow-x: auto; } main .top { display: none; }
  .hud .hudBtns { flex-wrap: nowrap; } .hud .hb { padding: 4px 9px; white-space: nowrap; } .hud .styleChip { white-space: nowrap; }
}
.scene { display: block; width: 100%; height: auto; max-height: 46vh; border-radius: 8px; box-shadow: 0 0 0 2px #000, 0 0 0 4px var(--edge, #8a6a3a); background: #17120e; }
@media (max-width: 520px) { .room { grid-template-columns: minmax(0, 1fr); } }
.room p { margin: 0; max-width: 62ch; line-height: 1.45; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--stone); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--comet); }
.btn.primary { background: var(--comet); color: var(--void); border-color: var(--comet); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.cost { display: flex; flex-wrap: wrap; gap: 6px; }
.cost span { padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--stone); font-size: .9rem; font-variant-numeric: tabular-nums; }
.cost .ok { border-color: var(--leaf); color: var(--leaf); }
.cost .short { border-color: var(--ember); color: var(--ember); }
.portrait { display: block; }

/* dialog window: the shared Path of the Light Keeper parchment box (headshot, nameplate, line, numbered answers, Style tags, checks) */
.dlgBack { position: fixed; inset: 0; z-index: 20; background: rgba(6, 8, 18, .55); display: flex; align-items: flex-end; justify-content: center;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.dlg { --parch: #f3e6c8; --parch2: #e6d3a8; --pink: #2b1d10; --pink2: #5a4630; --edge: #8a6a3a; --pgold: #c99a3c; --phover: #fff4d8; --paccent: #7a2e1c;
  --serious: #35577a; --silly: #8a5a12; --shy: #5d6e45; --smug: #6e3f73; --ok: #3d6b35; --bad: #8a2f22;
  position: relative; width: min(760px, 100%); background: linear-gradient(var(--parch), var(--parch2)); color: var(--pink); font-family: "Alegreya", Georgia, serif;
  border: 3px solid var(--edge); border-radius: 12px; box-shadow: 0 0 0 2px #2b1d10, 0 10px 30px rgba(0,0,0,.6); padding: 14px 16px 12px; }
.dlg .head { display: flex; gap: 12px; align-items: flex-start; }
.dlg .pic { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 10px; border: 2px solid var(--pgold); background: #201810; overflow: hidden; }
.dlg .pic svg { width: 100%; height: 100%; display: block; }
.dlg .plate { font-family: "Alegreya SC", Georgia, serif; font-weight: 700; font-size: 18px; color: var(--paccent); margin: 0 0 2px; }
.dlg .plate small { font-weight: 500; font-size: 13px; color: var(--pink2); margin-left: 6px; }
.dlg .line { font-size: 17px; line-height: 1.45; min-height: 3.2em; margin: 0; cursor: pointer; }
.dlg .line em { color: var(--pink2); }
.dlg .choices { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; }
.dlg .choices button { width: 100%; text-align: left; font: inherit; font-size: 16px; color: var(--pink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dlg .choices button:hover, .dlg .choices button:focus-visible { background: var(--phover); border-color: var(--edge); outline: none; }
.dlg .k { font-family: "Alegreya SC", Georgia, serif; color: var(--pink2); min-width: 1.2em; }
.dlg .ans { flex: 1; min-width: 0; }
.dlg .stag { font-family: "Alegreya SC", Georgia, serif; font-size: 12px; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; white-space: nowrap; }
.t-Serious { color: var(--serious); } .t-Silly { color: var(--silly); } .t-Shy { color: var(--shy); } .t-Smug { color: var(--smug); }
.dlg .check { font-size: 12px; color: var(--paccent); font-family: "Alegreya SC", Georgia, serif; white-space: nowrap; }
.dlg .roll { margin-top: 8px; font-family: "Alegreya SC", Georgia, serif; font-size: 15px; }
.dlg .roll.ok { color: var(--ok); } .dlg .roll.bad { color: var(--bad); }
.dlg .more { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: var(--pink2); }
@media (max-width: 560px) { .dlg .pic { width: 62px; height: 62px; } .dlg .line { font-size: 16px; } .dlg .choices button { font-size: 15px; } }

/* minigames */
.game { display: grid; gap: 12px; }
.gameWho { display: flex; gap: 12px; align-items: center; }
.game > .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.stat { font-variant-numeric: tabular-nums; color: var(--soft); }
.stat b { color: var(--ink); }
.d20 { display: inline-grid; place-items: center; width: 64px; height: 64px; font-family: var(--display); font-size: 1.6rem; color: var(--void); flex: none;
  background: var(--comet); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); font-variant-numeric: tabular-nums; }
.d20.crit { background: var(--frost); }
.d20.low { background: var(--ember); }
.result { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.result p { margin: 0; flex: 1 1 220px; min-width: 0; }
.hexWrap { max-width: 560px; width: 100%; padding: 10px; border-radius: 10px; border: 3px solid var(--edge, #8a6a3a); background: radial-gradient(ellipse at 50% 40%, #6a5a3a, #3a2f20); }
.hexWrap svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.hex { fill: #9a8a64; stroke: #1d140c; stroke-width: 2; stroke-linejoin: round; cursor: pointer; }
.hex:hover { fill: #b8a678; }
.hex:focus, #field g:focus, #yard g:focus { outline: none; }
#field g:focus-visible polygon { stroke: var(--frost); stroke-width: 3; }
.hex:focus-visible { stroke: var(--frost); stroke-width: 3; }
.hex.dug { fill: #4a3a26; cursor: default; }
.hex.found { fill: #e8c260; stroke: #1d140c; }
.hex.water { fill: #3f7fa6; stroke: #1d140c; cursor: default; }
.hex.soil { fill: #6a4a2a; }
.hex.watered { fill: #4a321c; stroke: #2f6f9a; stroke-width: 3; }
.hex.ready { stroke: #e8c260; stroke-width: 4; }
.hexT { font-family: var(--display); font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; fill: #fff4d8; stroke: #1d140c; stroke-width: 3px; paint-order: stroke; }
.hexT.small { font-family: var(--body); font-size: 13px; }
.hexT.far { fill: #c9b38a; }
.hexT.warmT { fill: #f0c04f; }
.hexT.hot { fill: #ff8a5a; }
.seeds { display: flex; flex-wrap: wrap; gap: 6px; }

:root { --role: #a8821f; --gold: #c99a3c; --parch: #f3e6c8; --parch2: #e6d3a8; --edge: #8a6a3a; --accent: #7a2e1c;

html, body { height: 100%; }

.sec:first-child { border-left: 2px solid #000; }

/* ---------- classic character art (heroSVG from farluck-adventure.html, copied as is and given a look to draw).
   N8's art rules: pigmented skin only (greenish is fine for Leyf and Lizerus), no hoods, masks or tails. */
const SKIN = {Leyf:"#7fa36a",Sapien:"#8a5e3c",Lizerus:"#8fae5a",Melkin:"#c9a0d8",Dimoneesh:"#8fa8d0"};
const ROLE_LOOK = {Maverick:"#3f6b45",Brawler:"#8a4a2a",Champion:"#b08a2a","Soul Seer":"#5a4a8a",Whisper:"#2f3a4a"};
const SIZE = lf => lf === "Melkin" ? .62 : lf === "Dimoneesh" ? .9 : 1;
const crown = `<path d="M-6 -110 l3 -9 3 6 3 -9 3 9 3 -6 3 9z" fill="#e8c260" stroke="#1d140c" stroke-width="1.4"/>`;
const specs = `<circle cx="11" cy="-93" r="5" fill="none" stroke="#c99a3c" stroke-width="1.6"/><path d="M5 -93 h-8" stroke="#c99a3c" stroke-width="1.4"/>`;
const strawHat = `<ellipse cx="4" cy="-104" rx="24" ry="5" fill="#d8b860" stroke="#1d140c" stroke-width="1.4"/><path d="M-8 -105 q2 -14 12 -14 q10 0 12 14z" fill="#e2c46a" stroke="#1d140c" stroke-width="1.4"/><path d="M-8 -106 h24" stroke="#7a2e1c" stroke-width="2.5"/>`;
const bandana = `<path d="M-10 -100 q14 -8 30 0 l-2 5 q-13 -6 -26 0z" fill="#b24a2a" stroke="#1d140c" stroke-width="1.3"/>`;
const apron = `<path d="M-9 -66 h20 l3 54 h-26z" fill="#efe0b8" stroke="#1d140c" stroke-width="1.4"/><path d="M-9 -60 h20" stroke="#c99a3c" stroke-width="1.5"/>`;
/* The castle folk. Lifeforms from the book where it says (Bruxanna is a Melkin, Wexler a Dimoneesh); the rest are my placeholders. */
const CAST = {
  bruxanna: { lf: "Melkin", role: "Soul Seer", cloak: "#6a3d8f", extra: crown + apron, noProp: true },
  wexler:   { lf: "Dimoneesh", role: "Soul Seer", cloak: "#2f5d6e", extra: specs },
  shnee:    { lf: "Leyf", role: "Brawler", cloak: "#6a5a3a", extra: bandana, noProp: true },
  faux:     { lf: "Lizerus", role: "Maverick", cloak: "#4f6b3a", extra: strawHat, noProp: true },
  treywind: { lf: "Sapien", role: "Brawler", cloak: "#7a3a22" },
  georgia:  { lf: "Lizerus", role: "Champion", cloak: "#8a4a2a", noProp: true, extra: apron },
  tata:     { lf: "Sapien", role: "Maverick", cloak: "#b24a5a", noProp: true },
  meya:     { lf: "Dimoneesh", role: "Soul Seer", cloak: "#4a3a7a" },
  sloan:    { lf: "Leyf", role: "Soul Seer", cloak: "#3f6f8f", noProp: true }
};
function lookOf(id) {
  if (id === "you" || !CAST[id]) { const h = S.hero || {}, lf = h.lf || "Sapien", role = h.role || "Champion";
    return { lf, role, skin: SKIN[lf], cloak: (ROLES[role] && ROLES[role].hue) || ROLE_LOOK[role], size: SIZE(lf) }; }
  const c = CAST[id]; return { lf: c.lf, role: c.role, skin: SKIN[c.lf], cloak: c.cloak, size: SIZE(c.lf), opt: { extra: c.extra, noProp: c.noProp } };
}
/* a figure standing at (x, y), feet on y; s scales it, flip faces it left */
function charAt(id, x, y, s = 1, flip = false) { const L = lookOf(id); return `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})">${charSVG(L, L.opt || {})}</g>`; }
/* head-and-shoulders portrait for dialogs and room cards */
function faceSVG(id, bg) {
  const L = lookOf(id), top = -126 * L.size, h = 64 * L.size + 8;
  return `<svg viewBox="-34 ${top.toFixed(1)} 72 ${h.toFixed(1)}" preserveAspectRatio="xMidYMid slice" style="display:block;width:100%;height:100%;background:radial-gradient(circle at 50% 35%, ${bg || "#4a3c2b"}, #17120e)">${charSVG(L, L.opt || {})}</svg>`;
}

/* ---------- dialog engine (shared Path of the Light Keeper format) */

  let dir = 0, face = 1, target = null, near = null, last = performance.now(), t0 = last;
  const nearDoor = () => { let best = null; HALL_ORDER.forEach(id => { const d = Math.abs(hallSpot(id) - hallX); if (d < 80 && (!best || d < best.d)) best = { id, d }; }); return best && best.id; };
  const labelFor = id => id === "yard" ? "Courtyard" : (() => { const r = room(id), st = plotState(r); return st === "built" ? r.name : st === "buildable" ? (r.section ? "Choose what to build" : "Build the " + r.name) : r.id === "training" ? "Training Ground (rubble)" : "Open plot"; })();
  const enter = id => {
    if (!id) return;
    if (id === "yard") { stopGame(); return showCourtyard(); }
    const r = room(id); if (plotState(r) === "open") { $("#plotNote").textContent = r.cost ? `${r.name}: build the ${room(r.needs).name} first.` : r.locked || r.text; return; }
    stopGame(); showRoom(id);
  };
  const step = t => {
    const dt = Math.min(40, t - last) / 1000; last = t;
    let v = dir;
    if (target != null) { const dx = target.x - hallX; if (Math.abs(dx) < 6) { const id = target.id; target = null; v = 0; hallX = hallSpot(id); return enter(id); } v = Math.sign(dx); }
    if (v) face = v;
    hallX = Math.max(60, Math.min(W - 60, hallX + v * 300 * dt));
    const vw = svg.clientWidth || 800, vh = svg.clientHeight || 360, viewW = 400 * vw / vh;
    const camX = Math.max(0, Math.min(W - viewW, hallX - viewW / 2));
    svg.setAttribute("viewBox", `${camX} 0 ${viewW} 400`);
    const bob = v && !reduce ? Math.abs(Math.sin((t - t0) / 90)) * -4 : 0;
    hero.setAttribute("transform", `translate(${hallX},${FLOOR})`);
    body.setAttribute("transform", `translate(0,${bob}) scale(${face},1)`);
    const n = nearDoor();
    if (n !== near) {
      near = n; $("#goIn").disabled = !n; $("#goIn").textContent = n ? "Enter: " + labelFor(n) : "Enter";
      if (n) { $("#promptT").textContent = labelFor(n); prompt.setAttribute("visibility", "visible"); const w = $("#promptT").getComputedTextLength() + 24; $("#promptBg").setAttribute("width", w); $("#promptBg").setAttribute("x", -w / 2); $("#promptBg").setAttribute("y", -19); }
      else prompt.setAttribute("visibility", "hidden");
    }
    if (n) prompt.setAttribute("transform", `translate(${hallX},${FLOOR - 98})`);
    raf = requestAnimationFrame(step);
  };
  const hold = (el, d) => {
    el.addEventListener("pointerdown", e => { e.preventDefault(); target = null; dir = d; });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, () => { if (dir === d) dir = 0; }));
  };
  hold($("#goL"), -1); hold($("#goR"), 1);
  $("#goIn").onclick = () => enter(near);
  svg.querySelectorAll("[data-door]").forEach(g => g.addEventListener("click", () => { target = { id: g.dataset.door, x: hallSpot(g.dataset.door) }; }));
  document.onkeydown = e => {
    if (!$("#dlgBack").hidden) return;
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") { e.preventDefault(); target = null; dir = -1; }
    else if (k === "arrowright" || k === "d") { e.preventDefault(); target = null; dir = 1; }
    else if ((k === "arrowup" || k === "w" || k === "enter" || k === "e") && near && !e.target.closest("button")) { e.preventDefault(); enter(near); }
  };
  document.onkeyup = e => { const k = e.key.toLowerCase(); if (((k === "arrowleft" || k === "a") && dir < 0) || ((k === "arrowright" || k === "d") && dir > 0)) dir = 0; };
  raf = requestAnimationFrame(step);
}

/* ---------- inventory (N8 2026-11-12): loadout = 1 Weapon, 1 Armor, 2 Ready slots (stacks of up to 3).
   The Pack holds what you find on Talus: 8 slots, stacks of 10. It comes home with you through your Return Shard or any Icosa Crystal in a town.
   Knocked out: you keep your loadout; the Pack stays where you fell and can be recovered once. */
const PACK_SLOTS = 8, PACK_STACK = 10, READY_STACK = 3;
function invInit() {
  if (!Array.isArray(S.gear)) S.gear = [];
  if (!S.loadout) S.loadout = { weapon: null, armor: null, ready: [null, null] };
  if (!S.pack) S.pack = [];
}
const dishCount = name => S.dishes.filter(d => d === name).length;
function takeDish(name, n) { for (let i = 0; i < n; i++) { const at = S.dishes.indexOf(name); if (at >= 0) S.dishes.splice(at, 1); } }
function readyText(r) { return r ? `${r.name} x${r.n}` : "Empty"; }
function packAdd(k, n) { // returns how many did not fit
  for (const sl of S.pack) if (sl.k === k && sl.n < PACK_STACK) { const add = Math.min(n, PACK_STACK - sl.n); sl.n += add; n -= add; }
  while (n > 0 && S.pack.length < PACK_SLOTS) { const add = Math.min(n, PACK_STACK); S.pack.push({ k, n: add }); n -= add; }
  return n;
}
function packGrid(pack) {
  let html = "";
  for (let i = 0; i < PACK_SLOTS; i++) { const sl = pack[i]; html += sl ? `<div class="slot" title="${itemName(sl.k)}"><img src="${iconOf(sl.k)}" alt="${itemName(sl.k)}"><b>${sl.n}</b><span>${itemName(sl.k)}</span></div>` : `<div class="slot empty"><span>Empty</span></div>`; }
  return `<div class="slots packSlots">${html}</div>`;
}
function loadoutCard() {
  const L = S.loadout;
  return `<div class="loadout">
    <div class="gslot"><span class="eyebrow">Weapon</span><b>${GEAR[L.weapon] ? GEAR[L.weapon].name : "None"}</b></div>
    <div class="gslot"><span class="eyebrow">Armor</span><b>${GEAR[L.armor] ? GEAR[L.armor].name : "None"}</b></div>
    <div class="gslot"><span class="eyebrow">Ready 1</span><b>${readyText(L.ready[0])}</b></div>
    <div class="gslot"><span class="eyebrow">Ready 2</span><b>${readyText(L.ready[1])}</b></div></div>`;
}

      S.phase = "castle"; save(); showBarracks(); openTalk("bruxanna", "mission1");
    }

  };

}

addEventListener("message", e => {

    const first = !S.farluckDone, via = d.via === "hearth" ? "You step out of Cecil's hearth glow and onto the Comet. " : "Your Return Shard cracks, and the Comet pulls you home. ", msg = via + (first ? farluckGifts(d.gifts) : ""); S.trip = null; save();

let raf = null, timers = [];

function dieHTML(v) { return `<span class="d20 ${v === 20 ? "crit" : v === 1 ? "low" : ""}" style="${v === 20 || v === 1 ? "" : diceCSS()}" aria-label="D20 rolled ${v}">${v}</span>`; }
function rollAnim(el, final, done) {
  if (reduce) { el.innerHTML = dieHTML(final); return done(); }
  let k = 0; const t = setInterval(() => { el.innerHTML = dieHTML(k++ < 9 ? d20() : final); if (k > 9) { clearInterval(t); done(); } }, 70); timers.push(t);
}
function hexPts(x, y, size) { return [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 30); return `${(x + size * Math.cos(a)).toFixed(1)},${(y + size * Math.sin(a)).toFixed(1)}`; }).join(" "); }

/* Scrap Yard: hot and cold digging in the rubble, then a D20 for the find */
function dig() {
  const COLS = 7, ROWS = 5, DIGS = S.warm.shnee ? 7 : 6, size = 34, w = Math.sqrt(3) * size;
  const target = [Math.floor(Math.random() * COLS), Math.floor(Math.random() * ROWS)];
  const cube = (c, r) => { const q = c - (r - (r & 1)) / 2; return [q, r, -q - r]; };
  const dist = (a, b) => { const A = cube(...a), B = cube(...b); return Math.max(Math.abs(A[0] - B[0]), Math.abs(A[1] - B[1]), Math.abs(A[2] - B[2])); };
  let left = DIGS, over = false, cells = "";
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = w * (c + 0.5 * (r & 1)) + w / 2 + 6, y = size * 1.5 * r + size + 6;
    cells += `<g data-c="${c}" data-r="${r}"><polygon class="hex" points="${hexPts(x, y, size)}" tabindex="0" role="button" aria-label="Dig here"/><text class="hexT" x="${x}" y="${y}"></text></g>`;
  }
  const W = w * (COLS + 0.5) + 12, H = size * 1.5 * (ROWS - 1) + size * 2 + 12;
  gameShell("scrap", "Dig the rubble", `
    <p class="note">Tap a patch to dig. Shnee calls out how close you are: <b>...</b> is cold, <b>?</b> is warmer, <b>!!!</b> is right next to it. You have ${DIGS} digs. Find the cache and every dig you have left adds to your D20. Coins turn up on 18 to 20.</p>
    <div class="stat">Digs left: <b id="left">${left}</b></div>
    <div class="hexWrap"><svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" id="yard" aria-label="Rubble patch">${cells}</svg></div>
    <div class="result" id="res"></div>`);
  const finish = found => {
    over = true; const bonus = found ? left : 0, roll = d20(), total = Math.min(20, roll + bonus);
    $("#res").innerHTML = `<span id="die"></span><p id="out">${found ? `You found the cache with ${left} dig${left === 1 ? "" : "s"} left! D20 + ${left}` : "Out of digs. You sift what you turned up: D20"}...</p>`;
    rollAnim($("#die"), roll, () => {
      let get;
      const ores = COLORS.map(c => "ore" + c).filter(known), ore = ores.length ? pick(ores) : null, sd = pick(Object.keys(CROP).filter(known));
      if (roll === 20) { S.shards++; addM("taroil", 1); get = "a <b>Crit Shard</b> and <b>1 Tar Oil</b>"; }
      else if (total >= 18) { if (ore) { addM(ore, 1); addM("stone", 1); get = `<b>1 ${MATS[ore]}</b> and <b>1 Stone</b>`; } else { addM("taroil", 2); addM("stone", 1); get = "<b>2 Tar Oil</b> and <b>1 Stone</b>"; } }
      else if (total >= 15) { S.seeds[sd] = SD(sd) + 2; addM("taroil", 1); addM("wood", 1); get = `<b>1 Tar Oil</b>, <b>1 Wood</b> and an old pouch of <b>2 ${CROP[sd].name} seeds</b>`; }
      else if (total >= 11) { addM("wood", 2); addM("stone", 1); get = "<b>2 Wood</b> and <b>1 Stone</b>"; }
      else if (total >= 6) { addM("stone", 2); addM("wood", 1); get = "<b>2 Stone</b> and <b>1 Wood</b>"; }
      else { addM("stone", 2); get = "<b>2 Stone</b>"; }
      if (total >= 18) { S.coins += 1; get += ", and <b>1 Icosa Coin</b>"; }
      if (found && (roll === 20 || total < 15 || total >= 18)) { const sp = pick(Object.keys(CROP).filter(known)); S.seeds[sp] = SD(sp) + 2; get += `, plus an old seed pouch with <b>2 ${CROP[sp].name} seeds</b>`; }
      save();
      $("#out").innerHTML = `You rolled ${roll}${bonus ? ` + ${bonus} = ${total}` : ""}. You get ${get}.<br><span class="btns" style="margin-top:8px"><button class="btn" type="button" id="again">Dig again</button><button class="btn" type="button" id="home">Back to the castle</button></span>`;
      $("#again").onclick = dig; $("#home").onclick = showHub;
    });
  };
  const tryDig = g => {
    if (over) return; const poly = g.querySelector("polygon"); if (poly.classList.contains("dug")) return;
    const c = +g.dataset.c, r = +g.dataset.r, d = dist([c, r], target), t = g.querySelector("text");
    left--; $("#left").textContent = left;
    if (d === 0) { poly.classList.add("found"); t.textContent = "★"; t.classList.add("warmT"); return finish(true); }
    poly.classList.add("dug");
    if (d === 1) { t.textContent = "!!!"; t.classList.add("hot"); } else if (d === 2) { t.textContent = "?"; t.classList.add("warmT"); } else { t.textContent = "..."; t.classList.add("far"); }
    poly.setAttribute("aria-label", d === 1 ? "Right next to it" : d === 2 ? "Warmer" : "Cold");
    if (left === 0) finish(false);
  };
  $("#yard").querySelectorAll("g[data-c]").forEach(g => {
    g.addEventListener("click", () => tryDig(g));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tryDig(g); } });
  });
}

/* Farm: plant on hex plots beside a stream, water the dry ones, rest, then harvest with a D20 */
const FARM_LAYOUT = (() => { // pointy-top hexes: a stream row on top, plots below
  const size = 38, w = Math.sqrt(3) * size, cells = [];
  for (let c = 0; c < 6; c++) cells.push({ x: w * c + w / 2 + 6, y: size + 6, water: true });
  for (let c = 0; c < 5; c++) cells.push({ x: w * (c + 0.5) + w / 2 + 6, y: size * 2.5 + 6, stream: true });
  for (let c = 0; c < 6; c++) cells.push({ x: w * c + w / 2 + 6, y: size * 4 + 6 });
  return { size, w, cells, W: w * 6 + 12, H: size * 5 + 12 };
})();
function farm() {
  const L = FARM_LAYOUT, plotCells = L.cells.filter(c => !c.water);
  while (S.plots.length < plotCells.length) S.plots.push(null);
  let seed = Object.keys(CROP).find(k => SD(k) > 0) || null;
  gameShell("farm", "Tend the plots", `
    <p class="note">Pick a seed and tap an empty plot to plant. The row beside the stream waters itself. The far row needs a bucket each day (tap a planted plot). Rest a night in the Barracks to let things grow. When a plot glows gold, tap it to harvest.</p>
    <div class="seeds" id="seeds"></div>
    <div class="stat">Day <b>${S.day}</b> &nbsp; Buckets left today: <b id="bk">${S.buckets}</b></div>
    <div class="hexWrap"><svg viewBox="0 0 ${L.W.toFixed(0)} ${L.H.toFixed(0)}" id="field" aria-label="Farm plots"></svg></div>
    <div class="btns"><button class="btn" type="button" id="restBtn">Rest a night</button></div>
    <div class="result" id="res"></div>`);
  const drawSeeds = () => {
    const owned = Object.keys(CROP).filter(k => SD(k) > 0);
    $("#seeds").innerHTML = owned.length ? owned.map(k => `<button type="button" data-k="${k}" aria-pressed="${seed === k}"><img class="mini" src="${iconOf(k)}" alt="">${CROP[k].name} <b>${SD(k)}</b><small class="stat">${CROP[k].nights} ${CROP[k].nights === 1 ? "night" : "nights"}</small></button>`).join("")
      : '<span class="stat">No seeds yet. Find the cache in the Scrap Yard: the old supply crates hold seed pouches.</span>';
    $("#seeds").querySelectorAll("button").forEach(b => b.onclick = () => { seed = b.dataset.k; drawSeeds(); });
  };
  const draw = () => {
    let html = "", pi = 0;
    L.cells.forEach(c => {
      if (c.water) { html += `<polygon class="hex water" points="${hexPts(c.x, c.y, L.size)}"/>`; return; }
      const i = pi++, p = S.plots[i];
      const cls = !p ? "soil" : p.ready ? "soil ready" : (p.watered || c.stream) ? "soil watered" : "soil";
      const label = !p ? "" : CROP[p.crop].name;
      const sub = !p ? (c.stream ? "stream" : "dry") : p.ready ? "harvest" : (c.stream || p.watered) ? "growing" : "thirsty";
      html += `<g data-i="${i}" tabindex="0" role="button" aria-label="Plot ${i + 1}: ${label || "empty"}, ${sub}"><polygon class="hex ${cls}" points="${hexPts(c.x, c.y, L.size)}"/>
        ${p ? `<image href="${iconOf(p.crop)}" x="${c.x - (p.ready ? 17 : 11)}" y="${c.y - (p.ready ? 34 : 26)}" width="${p.ready ? 34 : 22}" height="${p.ready ? 34 : 22}" opacity="${p.ready ? 1 : .75}"/>` : ""}
        <text class="hexT small" x="${c.x}" y="${c.y + 8}">${label}</text><text class="hexT small far" x="${c.x}" y="${c.y + 22}" style="font-size:11px">${sub}</text></g>`;
    });
    $("#field").innerHTML = html;
    $("#field").querySelectorAll("g[data-i]").forEach(g => {
      g.addEventListener("click", () => tap(+g.dataset.i));
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(+g.dataset.i); } });
    });
  };
  const tap = i => {
    const p = S.plots[i], stream = plotCells[i].stream;
    if (!p) {
      if (!seed || !SD(seed)) { $("#res").innerHTML = "<p>You're out of that seed. The Scrap Yard's old supply crates sometimes have more.</p>"; return; }
      S.seeds[seed]--; S.plots[i] = { crop: seed, nights: 0, wet: 0, watered: false, stream, ready: false };
      if (!SD(seed)) seed = Object.keys(CROP).find(k => SD(k) > 0) || null;
      save(); drawSeeds(); draw(); return;
    }
    if (p.ready) return harvest(i);
    if (stream || p.watered) { $("#res").innerHTML = `<p>The ${CROP[p.crop].name} is growing. Rest a night to help it along.</p>`; return; }
    if (S.buckets < 1) { $("#res").innerHTML = "<p>No buckets left today. Rest a night and the well refills.</p>"; return; }
    S.buckets--; p.watered = true; $("#bk").textContent = S.buckets; save(); draw();
  };
  const harvest = i => {
    const p = S.plots[i], wellFed = p.wet >= CROP[p.crop].nights, bonus = (wellFed ? 4 : 0) + (S.warm.faux ? 2 : 0), roll = d20(), total = roll + bonus;
    $("#res").innerHTML = `<span id="die"></span><p id="out">Harvest roll: D20${bonus ? ` + ${bonus}` : ""}${wellFed ? " (well watered)" : " (it went thirsty)"}...</p>`;
    rollAnim($("#die"), roll, () => {
      let n = roll === 1 ? 0 : total >= 20 ? 4 : total >= 15 ? 3 : total >= 9 ? 2 : 1;
      const back = total >= 10 ? 1 : 0;
      S.crops[p.crop] = C(p.crop) + n; if (n) S.coins += 1; S.seeds[p.crop] = SD(p.crop) + back; S.plots[i] = null; save();
      $("#out").innerHTML = roll === 1 ? `A natural 1. A plague gremlin got there first and the plot is bare. Faux sighs and hands you a sympathetic leaf.`
        : `You rolled ${roll}${bonus ? `, total ${total}` : ""}. You pick <b>${n} ${CROP[p.crop].name}</b>${back ? " and save <b>1 seed</b>" : ""}.${roll === 20 ? " A natural 20, a golden harvest!" : ""}`;
      drawSeeds(); draw();
    });
  };
  $("#restBtn").onclick = () => { rest(); farm(); };
  drawSeeds(); draw();
}

/* Kitchen: pick a recipe, keep the heat in the green band, stir on cue, then a D20 taste check */
const RECIPES = [ // placeholder recipes from N8's plants; effects to be tuned
  { id: "porridge", name: "Gorgrain Porridge", needs: { gorgrain: 2 }, effect: "restores 1D6 Life on Talus" },
  { id: "soup", name: "Char Bean Soup", cecil: true, needs: { charbean: 2, gorgrain: 1 }, effect: "restores 2D6 Life on Talus" },
  { id: "tart", name: "Jeewa Tart", needs: { jeewa: 2, gorgrain: 1 }, effect: "+1 Speed for your next battle" },
  { id: "cooler", name: "Meloon Cooler", needs: { meloon: 1, pinclover: 1 }, effect: "+1 Defense for your next battle" },
  { id: "stew", name: "Hearty Comet Stew", needs: { quobulb: 1, snarproot: 1, charbean: 2, halowart: 1 }, effect: "+3 Max Life for your next quest" }

  gameShell("kitchen", "Cook a dish", `
    <p class="note">You have: ${have}. Pick a recipe.</p>
    <div class="recipes">${RECIPES.map(r => r.cecil && !(S.recipes || []).includes(r.id) ? `<button type="button" disabled><b>Char Bean Soup</b><small>${S.farluckDone ? "Cecil of Farluck Farm knows this one" : "A recipe from Farluck Farm. Learn it there."}</small></button>` : !Object.keys(r.needs).every(known) ? `<button type="button" disabled><b>Unknown recipe</b><small>Needs ingredients from ${TIERS[Math.max(...Object.keys(r.needs).map(k => tierOf(k).tier))].region}</small></button>` : `<button type="button" data-r="${r.id}" ${can(r) ? "" : "disabled"}><b>${r.name}</b><span class="need">${Object.entries(r.needs).map(([k, v]) => `<span class="${C(k) >= v ? "" : "short"}"><img class="mini" src="${iconOf(k)}" alt="">${v} ${CROP[k].name}</span>`).join("")}</span><small>${r.effect}</small></button>`).join("")}</div>
    ${RECIPES.some(can) ? "" : '<p class="note">Nothing to cook yet. Grow some crops on the Farm first.</p>'}
    <div id="cook"></div>`);
  $("#view").querySelectorAll("[data-r]").forEach(b => b.onclick = () => cook(RECIPES.find(r => r.id === b.dataset.r)));
}
function cook(rec) {

  $("#view").querySelectorAll("[data-r]").forEach(b => b.disabled = true);
  $("#cook").innerHTML = `<div class="game">
    <h3 style="font-size:1.1rem">${rec.name}</h3>
    <p class="note">Hold <b>Bellows</b> (or the space bar) to raise the heat, let go to cool. Keep the marker in the green band. When Bruxanna shouts <b>Stir!</b>, tap Stir quickly.</p>
    <div class="heat"><div class="zone" id="zone"></div><div class="marker" id="mk"></div></div>
    <div class="stirCue" id="cue" aria-live="polite"></div>
    <div class="btns"><button class="btn primary" type="button" id="bellows">Bellows</button><button class="btn" type="button" id="stir">Stir</button></div>
    <div class="stat">Time: <b id="secs">15.0</b>s &nbsp; In the green: <b id="pct">0</b>% &nbsp; Stirs: <b id="stirs">0</b></div>
    <div class="result" id="res"></div></div>`;
  let heat = 20, hold = false, zc = 50, zDir = 1, inZone = 0, ticks = 0, stirs = 0, stirMiss = 0, cueAt = 0, cueOn = false, endAt = performance.now() + 15000, nextCue = performance.now() + 2500, last = performance.now();
  const zw = 22, mk = $("#mk"), zone = $("#zone");
  const press = v => { hold = v; };
  const bl = $("#bellows");
  bl.addEventListener("pointerdown", e => { e.preventDefault(); press(true); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => bl.addEventListener(ev, () => press(false)));
  document.onkeydown = e => { if (e.key === " " && $("#dlgBack").hidden) { e.preventDefault(); press(true); } };
  document.onkeyup = e => { if (e.key === " ") press(false); };
  $("#stir").onclick = () => { if (cueOn) { stirs++; cueOn = false; $("#stirs").textContent = stirs; $("#cue").innerHTML = "Nice stir!"; } };
  const step = t => {
    const dt = Math.min(40, t - last) / 1000; last = t;
    heat += (hold ? 55 : -38) * dt; heat = Math.max(0, Math.min(100, heat));
    zc += zDir * 7 * dt; if (zc > 70) zDir = -1; if (zc < 32) zDir = 1;
    zone.style.left = (zc - zw / 2) + "%"; zone.style.width = zw + "%"; mk.style.left = heat + "%";
    ticks++; if (Math.abs(heat - zc) <= zw / 2) inZone++;
    $("#pct").textContent = Math.round(inZone / ticks * 100);
    if (!cueOn && t > nextCue) { cueOn = true; cueAt = t; $("#cue").innerHTML = "<b>Stir!</b>"; }
    if (cueOn && t - cueAt > 1300) { cueOn = false; stirMiss++; $("#cue").textContent = "Missed the stir."; nextCue = t + 1800 + Math.random() * 1800; }
    const left = Math.max(0, endAt - t); $("#secs").textContent = (left / 1000).toFixed(1);
    if (left <= 0) return finish();
    raf = requestAnimationFrame(step);
  };
  const origStir = $("#stir").onclick;
  $("#stir").onclick = () => { const was = cueOn; origStir(); if (was) nextCue = performance.now() + 1800 + Math.random() * 1800; };
  const finish = () => {
    cancelAnimationFrame(raf); raf = null; document.onkeydown = null; document.onkeyup = null;
    $("#bellows").disabled = true; $("#stir").disabled = true; $("#cue").textContent = "";
    const pct = Math.round(inZone / ticks * 100), bonus = Math.round(pct / 10) + stirs * 2 - stirMiss, roll = d20(), total = roll + bonus;
    $("#res").innerHTML = `<span id="die"></span><p id="out">Taste check: D20 + ${bonus} (${pct}% in the green, ${stirs} stirs${stirMiss ? `, ${stirMiss} missed` : ""})...</p>`;
    rollAnim($("#die"), roll, () => {
      const q = roll === 20 ? "Legendary" : roll === 1 || total < 8 ? "Burnt" : total >= 22 ? "Delicious" : total >= 15 ? "Tasty" : "Plain";
      let msg = `You rolled ${roll}, total ${total}. `;
      if (q === "Burnt") msg += `The ${rec.name} is burnt. Bruxanna eats it anyway. "Still better than paste!"`;
      else {
        S.dishes.push(`${q} ${rec.name}`); S.coins += { Plain: 1, Tasty: 2, Delicious: 3, Legendary: 5 }[q];
        msg += `You made a <b>${q} ${rec.name}</b> (${rec.effect}${q === "Delicious" || q === "Legendary" ? ", plus a little extra" : ""}). It is in your Barracks chest.`;
        if (!S.met.firstMeal) { S.met.firstMeal = true; msg += ` Bruxanna takes one bite and has to sit down. "FLAVOR!"`; }
      }
      save();
      $("#out").innerHTML = msg + `<br><span class="btns" style="margin-top:8px"><button class="btn" type="button" id="again">Cook another</button><button class="btn" type="button" id="home">Back to the castle</button></span>`;
      $("#again").onclick = kitchen; $("#home").onclick = showHub;
    });
  };
  raf = requestAnimationFrame(step);
}

/* ---------- starfield (gentle; still when reduced motion) */
(() => {
  const cv = $("#stars"), cx = cv.getContext("2d"); let stars = [];
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; stars = [...Array(Math.round(innerWidth * innerHeight / 5000))].map(() => [Math.random() * cv.width, Math.random() * cv.height, Math.random() * 1.4 + .3, Math.random() * 6]); };
  const draw = t => { cx.clearRect(0, 0, cv.width, cv.height); for (const [x, y, r, p] of stars) { cx.globalAlpha = .35 + .4 * Math.sin(t / 1400 + p) ** 2; cx.fillStyle = "#ede7d6"; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); } if (!reduce) requestAnimationFrame(draw); };
  addEventListener("resize", size); size(); requestAnimationFrame(draw);
})();

/* every hotspot (room scenes, hall doors) gets a soft aura that shows only on hover or focus */
function addAuras() { document.querySelectorAll("#view .scene .hot, #view .hdoor").forEach(g => { if (g.querySelector(":scope > .hl")) return; let b; try { b = g.getBBox(); } catch (e) { return; } if (!b.width) return;
  const el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse"); el.setAttribute("class", "hl");
  el.setAttribute("cx", b.x + b.width / 2); el.setAttribute("cy", b.y + b.height / 2); el.setAttribute("rx", b.width / 2 + 18); el.setAttribute("ry", b.height / 2 + 14); g.insertBefore(el, g.firstChild); }); }
new MutationObserver(() => addAuras()).observe($("#view"), { childList: true, subtree: true });
/* scene hotspots press the button they stand for (if that button is on the page right now) */

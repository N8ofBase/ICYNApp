<title>Castle Comet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+SC:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the Comet from above, as Project Lightbringer tells it. The Courtyard with the Teleportation Station's
   circle of crystals is the middle; rooms sit on plots around it, some built, some open for you to build.
   One night-sky look on purpose (the castle rides a comet through space). */
:root {
  color-scheme: dark;
  --void: #0c0f1f; --hall: #171c35; --stone: #262c4d; --line: #3b4370;
  --ink: #ede7d6; --soft: #a8a6bd;
  --comet: #f0c04f; --ember: #e2714b; --frost: #82cbd9; --leaf: #8fc274; --water: #3f7fa6;
  --display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { min-height: 100%; }
body {
  background: var(--void); color: var(--ink); font-family: var(--body); font-size: 16px; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px; box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--comet); outline-offset: 2px; }
.note { color: var(--soft); font-size: .9rem; margin: 0; }

/* top bar */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
.top h1 { font-size: 2rem; letter-spacing: .04em; color: var(--comet); }
.top .sub { color: var(--soft); font-size: .95rem; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pouch { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
.pouch span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--hall); font-size: .85rem; white-space: nowrap; }
.pouch b { color: var(--comet); font-weight: 700; }
.styleChip { padding: 3px 9px; border: 1px solid var(--comet); border-radius: 12px; background: var(--hall); font-size: .85rem; color: var(--comet); cursor: pointer; }

/* hub */
.hub { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .hub { grid-template-columns: minmax(0, 1fr); } }
.ringWrap { max-width: 560px; width: 100%; margin: 0 auto; }
.ringWrap svg { display: block; width: 100%; height: auto; user-select: none; touch-action: manipulation; }
.plot { cursor: pointer; }
.plot:focus { outline: none; }
.plot circle.face { fill: var(--stone); stroke: var(--line); stroke-width: 2; stroke-dasharray: 6 6; transition: fill .2s; }
.plot.built circle.face { fill: #3a3150; stroke: var(--comet); stroke-dasharray: none; }
.plot.buildable circle.face { stroke: var(--comet); }
.plot:hover circle.face, .plot:focus-visible circle.face { fill: #4a3f2c; }
.plot:focus-visible circle.face { stroke: var(--frost); stroke-width: 3; }
.plot text { font-family: var(--display); font-size: 17px; text-anchor: middle; fill: var(--soft); pointer-events: none; }
.plot.built text { fill: var(--ink); }
.plot.buildable text { fill: var(--comet); }
.path { stroke: var(--line); stroke-width: 10; stroke-linecap: round; }
.path.built { stroke: #4a4060; }
.yard { fill: #1d2240; stroke: var(--comet); stroke-width: 2; cursor: pointer; }
.yard:hover { fill: #252a4d; }
.yardText { font-family: var(--display); fill: var(--comet); text-anchor: middle; pointer-events: none; }
.crystal { fill: var(--frost); opacity: .9; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .crystals { animation: pulse 3.2s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }

.panel { background: var(--hall); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: 1.3rem; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.roomList { display: grid; gap: 6px; }
.roomList button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--stone); cursor: pointer; }
.roomList button:hover { border-color: var(--comet); }
.roomList small { color: var(--soft); }
.tag { font-size: .72rem; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--comet); color: var(--comet); white-space: nowrap; }
.tag.dim { border-color: var(--line); color: var(--soft); }
.journal { margin: 0; padding-left: 18px; color: var(--soft); font-size: .9rem; display: grid; gap: 4px; }
.warm { color: var(--leaf); font-size: .9rem; margin: 0; }

/* room */
.room { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 520px) { .room { grid-template-columns: minmax(0, 1fr); } }
.room p { margin: 0; max-width: 62ch; line-height: 1.45; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--stone); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--comet); }
.btn.primary { background: var(--comet); color: var(--void); border-color: var(--comet); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.cost { display: flex; flex-wrap: wrap; gap: 6px; }
.cost span { padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--stone); font-size: .9rem; font-variant-numeric: tabular-nums; }
.cost .ok { border-color: var(--leaf); color: var(--leaf); }
.cost .short { border-color: var(--ember); color: var(--ember); }
.portrait { display: block; }

/* dialog window: the shared Crit Quest parchment box (headshot, nameplate, line, numbered answers, Style tags, checks) */
.dlgBack { position: fixed; inset: 0; z-index: 20; background: rgba(6, 8, 18, .55); display: flex; align-items: flex-end; justify-content: center;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.dlg { --parch: #f3e6c8; --parch2: #e6d3a8; --pink: #2b1d10; --pink2: #5a4630; --edge: #8a6a3a; --pgold: #c99a3c; --phover: #fff4d8; --paccent: #7a2e1c;
  --serious: #35577a; --silly: #8a5a12; --shy: #5d6e45; --smug: #6e3f73; --ok: #3d6b35; --bad: #8a2f22;
  position: relative; width: min(760px, 100%); background: linear-gradient(var(--parch), var(--parch2)); color: var(--pink); font-family: "Alegreya", Georgia, serif;
  border: 3px solid var(--edge); border-radius: 12px; box-shadow: 0 0 0 2px #2b1d10, 0 10px 30px rgba(0,0,0,.6); padding: 14px 16px 12px; }
.dlg .head { display: flex; gap: 12px; align-items: flex-start; }
.dlg .pic { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 10px; border: 2px solid var(--pgold); background: #201810; overflow: hidden; }
.dlg .pic svg { width: 100%; height: 100%; display: block; }
.dlg .plate { font-family: "Alegreya SC", Georgia, serif; font-weight: 700; font-size: 18px; color: var(--paccent); margin: 0 0 2px; }
.dlg .plate small { font-weight: 500; font-size: 13px; color: var(--pink2); margin-left: 6px; }
.dlg .line { font-size: 17px; line-height: 1.45; min-height: 3.2em; margin: 0; cursor: pointer; }
.dlg .line em { color: var(--pink2); }
.dlg .choices { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 4px; }
.dlg .choices button { width: 100%; text-align: left; font: inherit; font-size: 16px; color: var(--pink); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dlg .choices button:hover, .dlg .choices button:focus-visible { background: var(--phover); border-color: var(--edge); outline: none; }
.dlg .k { font-family: "Alegreya SC", Georgia, serif; color: var(--pink2); min-width: 1.2em; }
.dlg .ans { flex: 1; min-width: 0; }
.dlg .stag { font-family: "Alegreya SC", Georgia, serif; font-size: 12px; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; white-space: nowrap; }
.t-Serious { color: var(--serious); } .t-Silly { color: var(--silly); } .t-Shy { color: var(--shy); } .t-Smug { color: var(--smug); }
.dlg .check { font-size: 12px; color: var(--paccent); font-family: "Alegreya SC", Georgia, serif; white-space: nowrap; }
.dlg .roll { margin-top: 8px; font-family: "Alegreya SC", Georgia, serif; font-size: 15px; }
.dlg .roll.ok { color: var(--ok); } .dlg .roll.bad { color: var(--bad); }
.dlg .more { position: absolute; right: 14px; bottom: 8px; font-size: 13px; color: var(--pink2); }
@media (max-width: 560px) { .dlg .pic { width: 62px; height: 62px; } .dlg .line { font-size: 16px; } .dlg .choices button { font-size: 15px; } }

/* minigames */
.game { display: grid; gap: 12px; }
.game > .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.stat { font-variant-numeric: tabular-nums; color: var(--soft); }
.stat b { color: var(--ink); }
.d20 { display: inline-grid; place-items: center; width: 64px; height: 64px; font-family: var(--display); font-size: 1.6rem; color: var(--void); flex: none;
  background: var(--comet); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); font-variant-numeric: tabular-nums; }
.d20.crit { background: var(--frost); }
.d20.low { background: var(--ember); }
.result { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.result p { margin: 0; flex: 1 1 220px; min-width: 0; }
.hexWrap { max-width: 540px; width: 100%; }
.hexWrap svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.hex { fill: #3a3326; stroke: #5c4f37; stroke-width: 2; cursor: pointer; }
.hex:hover { fill: #4a4130; }
.hex:focus, #field g:focus, #yard g:focus { outline: none; }
#field g:focus-visible polygon { stroke: var(--frost); stroke-width: 3; }
.hex:focus-visible { stroke: var(--frost); stroke-width: 3; }
.hex.dug { fill: #1d1912; cursor: default; }
.hex.found { fill: #6b5a28; stroke: var(--comet); }
.hex.water { fill: var(--water); stroke: #2c5a78; cursor: default; }
.hex.soil { fill: #4a3a26; }
.hex.watered { fill: #3c3424; stroke: var(--frost); }
.hex.ready { stroke: var(--comet); stroke-width: 3; }
.hexT { font-family: var(--display); font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; fill: var(--ink); }
.hexT.small { font-family: var(--body); font-size: 13px; }
.hexT.far { fill: var(--soft); }
.hexT.warmT { fill: var(--comet); }
.hexT.hot { fill: var(--ember); }
.seeds { display: flex; flex-wrap: wrap; gap: 6px; }
.seeds button { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--stone); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.seeds button[aria-pressed="true"] { border-color: var(--comet); background: #4a3f2c; }
.seeds button:disabled { opacity: .45; cursor: not-allowed; }
.sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.recipes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.recipes button { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--stone); cursor: pointer; display: grid; gap: 2px; }
.recipes button:hover { border-color: var(--comet); }
.recipes button:disabled { opacity: .45; cursor: not-allowed; }
.recipes small { color: var(--soft); }
.heat { position: relative; height: 54px; border-radius: 8px; background: linear-gradient(90deg, #1f2a44, #4b2a22 55%, #7a2a1a); border: 1px solid var(--line); overflow: hidden; }
.heat .zone { position: absolute; top: 0; bottom: 0; background: rgba(143, 194, 116, .3); border-left: 2px solid var(--leaf); border-right: 2px solid var(--leaf); }
.heat .marker { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: var(--ink); border-radius: 3px; box-shadow: 0 0 10px var(--ember); }
.stirCue { min-height: 2.4em; display: flex; align-items: center; gap: 10px; }
.stirCue b { color: var(--comet); font-family: var(--display); font-size: 1.2rem; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--comet); color: var(--void);
  padding: 8px 16px; border-radius: 18px; font-weight: 700; box-shadow: 0 4px 20px rgba(0,0,0,.5); max-width: calc(100% - 32px); text-align: center; }
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<main>
  <header class="top">
    <div>
      <h1>Castle Comet</h1>
      <div class="sub" id="sub">Home of the Light Keepers. Build it back up, one room at a time.</div>
    </div>
    <div class="bar"><button type="button" class="styleChip" id="styleChip">Choose a Style</button><div class="pouch" id="pouch" aria-label="Your pouch"></div></div>
  </header>
  <section id="view"></section>
</main>
<div class="dlgBack" id="dlgBack" hidden>
  <div class="dlg" id="dlgBox" role="dialog" aria-modal="true" aria-labelledby="dlgWho">
    <div class="head">
      <div class="pic" id="dlgPic"></div>
      <div style="flex:1;min-width:0"><p class="plate" id="dlgWho"></p><p class="line" id="dlgLine" aria-live="polite"></p></div>
    </div>
    <ul class="choices" id="dlgChoices"></ul>
    <div class="roll" id="dlgRoll"></div>
    <div class="more" id="dlgMore" hidden></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const d20 = () => 1 + Math.floor(Math.random() * 20);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- saved state (this browser only) */
const START = { day: 1, scrap: 0, stone: 0, timber: 0, lyr: 0, shards: 0,
  seeds: { jeewa: 2, charbean: 2, mint: 1 }, crops: { jeewa: 0, charbean: 0, mint: 0 }, dishes: [],
  built: { barracks: true, scrap: true }, plots: [], buckets: 3, met: {}, style: null, warm: {}, clues: [] };
let S;
try { S = Object.assign(structuredClone(START), JSON.parse(localStorage.getItem("cq-comet-v3") || "{}")); } catch (e) { S = structuredClone(START); }
function save() { try { localStorage.setItem("cq-comet-v3", JSON.stringify(S)); } catch (e) {} renderPouch(); }
const CROP = {
  jeewa: { name: "Jeewa", color: "#e2714b", nights: 2 },
  charbean: { name: "Charbean", color: "#9a6a3e", nights: 1 },
  mint: { name: "Mint", color: "#8fc274", nights: 1 }
};
function renderPouch() {
  const c = S.crops, items = [["Day", S.day], ["Scrap", S.scrap], ["Stone", S.stone], ["Timber", S.timber],
    ["Crops", c.jeewa + c.charbean + c.mint], ["Dishes", S.dishes.length]];
  if (S.lyr) items.push(["Lyr Dust", S.lyr]);
  if (S.shards) items.push(["Crit Shards", S.shards]);
  $("#pouch").innerHTML = items.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("");
}
let toastT;
function toast(msg) { const t = $("#toast"); t.innerHTML = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3400); }

/* ---------- people (Bruxanna, Wexler and the narrator crystal use the shared dialog faces) */
const SHARED_FACES = {
  bruxanna: `<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#2d2440"/><circle cx="42" cy="42" r="36" fill="#f6e7b0" opacity=".18"/><path d="M14 84c4-18 14-26 28-26s24 8 28 26z" fill="#6a3d8f"/><path d="M30 60l12 10 12-10" fill="none" stroke="#e8c260" stroke-width="3"/><ellipse cx="42" cy="38" rx="15" ry="18" fill="#d9a57c"/><path d="M26 36c0-14 7-22 16-22s16 8 16 22c-4-7-9-10-16-10s-12 3-16 10z" fill="#3b2316"/><path d="M28 20l4-9 5 7 5-9 5 9 5-7 4 9z" fill="#e8c260"/><circle cx="36" cy="38" r="2" fill="#2b1d10"/><circle cx="48" cy="38" r="2" fill="#2b1d10"/><path d="M36 47q6 4 12 0" stroke="#7a3a2a" stroke-width="2" fill="none"/></svg>`,
  wexler: `<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#223040"/><path d="M12 84c4-18 15-25 30-25s26 7 30 25z" fill="#2f5d6e"/><ellipse cx="42" cy="40" rx="14" ry="17" fill="#e3b892"/><path d="M27 32c2-12 9-17 15-17s14 5 15 17c-3-3-6-4-8-4l-3-6-4 6-4-6-3 6c-3 0-6 1-8 4z" fill="#c9c2b0"/><circle cx="36" cy="40" r="5" fill="none" stroke="#c99a3c" stroke-width="2"/><circle cx="48" cy="40" r="5" fill="none" stroke="#c99a3c" stroke-width="2"/><line x1="41" y1="40" x2="43" y2="40" stroke="#c99a3c" stroke-width="2"/><circle cx="36" cy="40" r="1.6" fill="#2b1d10"/><circle cx="48" cy="40" r="1.6" fill="#2b1d10"/><path d="M37 50q5 -3 10 1" stroke="#7a3a2a" stroke-width="2" fill="none"/><rect x="56" y="56" width="16" height="20" rx="2" fill="#efe0b8" transform="rotate(12 64 66)"/></svg>`,
  narrator: `<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#1d2633"/><polygon points="42,12 62,36 54,74 30,74 22,36" fill="#bfe4ff" stroke="#fff" stroke-width="1.5"/></svg>`
};
const PEOPLE = {
  bruxanna: { name: "Bruxanna Barr", role: "Welcoming committee", hue: "#f0c04f", letter: "B" },
  wexler:   { name: "Wexler", role: "Perfector of Wisdom", hue: "#82cbd9", letter: "W" },
  shnee:    { name: "Shnee", role: "Scrap Yard", hue: "#c9a36b", letter: "S" },
  faux:     { name: "Faux", role: "Farm", hue: "#8fc274", letter: "F" },
  you:      { name: "The Barracks", role: "Your room", hue: "#a8a6bd", letter: "⌂" },
  narrator: { name: "", role: "", hue: "#82cbd9", letter: "" }
};
/* What warming someone up gives you, once. */
const PERKS = {
  bruxanna: "Bruxanna gives you 2 Jeewa seeds she was saving.",
  wexler: "Wexler shares his notes with you.",
  shnee: "Shnee gives you 1 extra dig in the Scrap Yard.",
  faux: "Faux adds +2 to every harvest roll."
};
const HERO_CHARM = 2; // mock Hero's Charm until the Hero builder is joined in
let picN = 0;
function portrait(id, size) {
  if (SHARED_FACES[id]) return `<div style="width:${size}px;height:${size}px;border-radius:12px;overflow:hidden;border:2px solid #c99a3c">${SHARED_FACES[id]}</div>`;
  const p = PEOPLE[id], g = "pg" + (picN++);
  return `<svg class="portrait" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${p.name}">
    <defs><radialGradient id="${g}" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="${p.hue}"/><stop offset="1" stop-color="#171c35"/></radialGradient></defs>
    <rect width="100" height="100" rx="12" fill="url(#${g})" stroke="${p.hue}" stroke-width="4"/>
    <text x="50" y="54" text-anchor="middle" dominant-baseline="central" font-family="Marcellus, Georgia, serif" font-size="46" fill="#0c0f1f">${p.letter}</text></svg>`;
}

/* ---------- rooms on the plots around the Courtyard.
   The book: a dull, half-empty stone castle with only a few custodians aboard, living on nutrient paste.
   The castle forms a room when you open its doors; here you gather what it needs first. */
const ROOMS = [
  { id: "barracks", name: "Barracks", who: "you", text: "The common room with the long wooden table. Your own room opens off it, and it formed itself from your memories the first time you opened the doors.", game: null },
  { id: "scrap", name: "Scrap Yard", who: "shnee", text: "The crumbling outer wall of the castle. Shnee digs through the fallen stone for anything still useful.", game: "dig" },
  { id: "farm", name: "Farm", who: "faux", text: "Soil plots beside a little stream, open to the sky. Grow real food, so nobody has to eat nutrient paste again.", game: "farm", cost: { scrap: 4, stone: 2 } },
  { id: "kitchen", name: "Kitchen", who: "bruxanna", talk: "kitchen", text: "A warm hearth and a big pot. Cook what you grow into dishes that heal and help you on Talus.", game: "kitchen", cost: { scrap: 3, stone: 1, timber: 3 }, needs: "farm" },
  { id: "open1", name: "Open plot", text: "An empty stretch of comet rock. More rooms come with the story." },
  { id: "open2", name: "Open plot", text: "An empty stretch of comet rock. More rooms come with the story." },
  { id: "open3", name: "Open plot", text: "An empty stretch of comet rock. More rooms come with the story." },
  { id: "open4", name: "Open plot", text: "An empty stretch of comet rock. More rooms come with the story." }
];
const room = id => ROOMS.find(r => r.id === id);
const MAT = { scrap: "Scrap", stone: "Stone", timber: "Timber" };
const canAfford = c => Object.entries(c).every(([k, v]) => S[k] >= v);

/* ---------- dialog trees, in the shared format.

/* ---------- dialog engine (shared Crit Quest format) */
let typing = null, full = "", node = null, nodeWho = null, shown = [], afterStyle = null, votes = [];
const STYLES = ["Serious", "Silly", "Shy", "Smug"];
function openTalk(id, key = "start") {
  if (!S.style && id !== "narrator") { afterStyle = [id, key]; votes = []; id = "narrator"; key = "q1"; }
  let nd = TALK[id][key];
  if (id === "narrator" && key === "result") {
    const count = {}; votes.forEach(v => count[v] = (count[v] || 0) + 1);
    const win = votes.reduce((a, v) => count[v] > (count[a] || 0) ? v : a, votes[0] || "Serious");
    nd = { t: `Your answers say your Style is <b>${win}</b>. You can keep it or choose another.`, styles: true, keep: win };
  }
  if (!nd) return closeTalk();
  node = nd; nodeWho = id;
  let text = nd.t;
  if (id === "you" && key === "chest") text = S.dishes.length ? "Inside: " + S.dishes.join(", ") + "." : "The chest is empty. Dishes from the Kitchen will go here.";
  if (id === "you" && key === "mirror") text = `You see a Light Keeper with a <b>${S.style}</b> Style looking back.`;
  if (nd.clue) addClue(nd.clue);
  S.met[id] = true;
  const face = id === "kitchen" ? "bruxanna" : id, p = PEOPLE[face];
  $("#dlgPic").innerHTML = SHARED_FACES[face] || portrait(face, "100%");
  $("#dlgWho").innerHTML = p.name ? `${p.name}<small>${id === "kitchen" ? "Kitchen" : p.role}</small>` : "";
  $("#dlgChoices").innerHTML = ""; $("#dlgRoll").textContent = ""; $("#dlgRoll").className = "roll"; $("#dlgMore").hidden = true;
  $("#dlgBack").hidden = false;
  type(text);
}
function type(html) {
  full = html; const el = $("#dlgLine"); clearInterval(typing);
  if (reduce) { el.innerHTML = html; return done(); }
  let i = 0; el.innerHTML = "";
  typing = setInterval(() => {
    i += 2; const lt = html.lastIndexOf("<", i), gt = html.lastIndexOf(">", i); if (lt > gt) i = html.indexOf(">", i) + 1;
    el.innerHTML = html.slice(0, i);
    if (i >= html.length) { clearInterval(typing); typing = null; done(); }
  }, 22);
}
function finishTyping() { if (!typing) return false; clearInterval(typing); typing = null; $("#dlgLine").innerHTML = full; done(); return true; }
function addBtn(html, fn) { const li = document.createElement("li"), b = document.createElement("button"); b.type = "button"; b.innerHTML = html; b.onclick = fn; li.appendChild(b); $("#dlgChoices").appendChild(li); }
function done() {
  if (node.styles) {
    shown = (node.keep ? [node.keep, ...STYLES.filter(x => x !== node.keep)] : STYLES).map(st => ({ st }));
    const blurb = { Serious: "steady, few words", Silly: "jokes, makes friends fast", Shy: "quiet, notices things", Smug: "confident, secretly kind" };
    shown.forEach((o, n) => addBtn(`<span class="k">${n + 1}.</span><span class="ans">${node.keep ? (n ? "Change to " : "Keep ") : ""}${o.st} <em style="color:var(--pink2)">${blurb[o.st]}</em></span><span class="stag t-${o.st}">Style</span>`, () => chooseStyle(o.st)));
  } else if (node.c) {
    shown = node.c.filter(c => !c.s || c.s === S.style);
    shown.forEach((c, n) => addBtn(`<span class="k">${n + 1}.</span><span class="ans">${c.t}</span>${c.s ? `<span class="stag t-${c.s}">${c.s}</span>` : ""}${c.check ? `<span class="check">Charm ${c.check}</span>` : ""}`, () => pickAnswer(c)));
  } else { shown = []; $("#dlgMore").hidden = false; $("#dlgMore").textContent = node.next ? "▼ tap to continue" : "▼ tap to close"; return; }
  const f = $("#dlgChoices").querySelector("button"); if (f) f.focus({ preventScroll: true });
}
function chooseStyle(st) {
  S.style = st; save(); renderStyle();
  toast(`Your Style: ${st}. You get a bonus ${st} answer in each talk.`);
  if (afterStyle) { const [id, key] = afterStyle; afterStyle = null; openTalk(id, key); } else closeTalk();
}
function warmUp(who) {
  if (S.warm[who]) return;
  S.warm[who] = true;
  if (who === "bruxanna") S.seeds.jeewa += 2;
  save();
  toast(`${PEOPLE[who].name} warmed to you. ${PERKS[who]}`);
}
function pickAnswer(c) {
  if (c.vote) votes.push(c.vote);
  if (c.clue) addClue(c.clue);
  if (c.works) c.works.forEach(warmUp);
  if (c.check) {
    const d = d20(), tot = d + HERO_CHARM, ok = tot >= c.check;
    $("#dlgChoices").innerHTML = "";
    const r = $("#dlgRoll"); r.textContent = `Charm check: rolled ${d} + ${HERO_CHARM} Charm = ${tot} vs ${c.check}. ${ok ? "Success!" : "Not this time."}`; r.className = "roll " + (ok ? "ok" : "bad");
    if (ok && nodeWho === "shnee") { S.scrap += 2; save(); }
    setTimeout(() => route(ok ? c.go : c.fail), 1300); return;
  }
  route(c.go);
}
function route(go) {
  if (go === "close") return closeTalk();
  if (go === "restyle") { afterStyle = null; return openTalk("narrator", "change"); }
  if (go === "rest") { closeTalk(); return rest(); }
  if (go.startsWith("talk:")) return openTalk(go.slice(5));
  if (go.startsWith("play:")) { closeTalk(); return startGame(go.slice(5)); }
  if (go.startsWith("room:")) { closeTalk(); return showRoom(go.slice(5)); }
  openTalk(nodeWho, go);
}
function advance() {
  if (finishTyping()) return;
  if (node.c || node.styles) return;
  if (node.next) openTalk(nodeWho, node.next); else closeTalk();
}
function closeTalk() { clearInterval(typing); typing = null; const was = !$("#dlgBack").hidden; $("#dlgBack").hidden = true; if (was && $("#yardBtn")) showHub(); }
function addClue(c) { if (!S.clues.includes(c)) { S.clues.push(c); save(); toast("New clue in your Journal"); } }
function renderStyle() { $("#styleChip").textContent = S.style ? "Style: " + S.style : "Choose a Style"; }
$("#dlgBox").addEventListener("click", e => { if (!e.target.closest("button")) advance(); });
document.addEventListener("keydown", e => {
  if ($("#dlgBack").hidden) return;
  if (e.key === "Escape") return closeTalk();
  if (e.key === " " || e.key === "Enter") { if (!e.target.closest || !e.target.closest(".choices")) { e.preventDefault(); advance(); } return; }
  const n = parseInt(e.key, 10);
  if (!typing && n >= 1 && n <= shown.length) { e.preventDefault(); const o = shown[n - 1]; o.st ? chooseStyle(o.st) : pickAnswer(o); }
});

/* ---------- rest a night: the day turns, crops grow, buckets refill */
function rest() {
  S.day++; S.buckets = 3;
  let grown = 0;
  S.plots.forEach(p => { if (p && p.crop) { p.nights++; if (p.watered || p.stream) p.wet++; p.watered = false; if (p.nights >= CROP[p.crop].nights && !p.ready) { p.ready = true; grown++; } } });
  save();
  toast(`You rest a night and wake on day ${S.day}.${grown ? ` ${grown} ${grown === 1 ? "plot is" : "plots are"} ready to harvest.` : ""}`);
  if ($("#yardBtn")) showHub();
}

/* ---------- hub: the Courtyard in the middle, plots in a ring */
function plotState(r) { if (S.built[r.id]) return "built"; if (r.cost && (!r.needs || S.built[r.needs])) return "buildable"; return "open"; }
function showHub() {
  stopGame();
  const cx = 300, cy = 300, R = 215;
  let paths = "", plots = "";
  ROOMS.forEach((r, i) => {
    const a = -Math.PI / 2 + i * Math.PI / 4, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a), st = plotState(r);
    paths += `<line class="path ${st === "built" ? "built" : ""}" x1="${cx + 100 * Math.cos(a)}" y1="${cy + 100 * Math.sin(a)}" x2="${x - 50 * Math.cos(a)}" y2="${y - 50 * Math.sin(a)}"/>`;
    const label = st === "open" ? "Open" : r.name, sub = st === "buildable" ? "Build" : st === "built" && r.game ? "" : "";
    plots += `<g class="plot ${st}" tabindex="0" role="button" data-id="${r.id}" aria-label="${r.name}${st === "buildable" ? ", ready to build" : st === "open" ? "" : ""}">
      <circle class="face" cx="${x}" cy="${y}" r="52"/>
      <text x="${x}" y="${y + (st === "buildable" ? -4 : 6)}">${label}</text>
      ${st === "buildable" ? `<text x="${x}" y="${y + 18}" style="font-size:13px;font-family:var(--body)">Build</text>` : ""}
      <title>${r.name}</title></g>`;
  });
  let crystals = "";
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, x = cx + 34 * Math.cos(a), y = cy - 10 + 26 * Math.sin(a); crystals += `<polygon class="crystal" points="${x},${y - 16} ${x + 6},${y} ${x},${y + 8} ${x - 6},${y}"/>`; }
  const built = ROOMS.filter(r => plotState(r) === "built"), toBuild = ROOMS.filter(r => plotState(r) === "buildable");
  $("#view").innerHTML = `<div class="hub">
    <div class="ringWrap"><svg viewBox="0 0 600 600" aria-label="Map of the Castle Comet">
      <ellipse cx="300" cy="300" rx="290" ry="290" fill="#121630" stroke="#262c4d" stroke-width="2"/>
      ${paths}
      <circle class="yard" id="yardBtn" cx="300" cy="300" r="100" tabindex="0" role="button" aria-label="The Courtyard and Teleportation Station"/>
      <g class="crystals">${crystals}</g>
      <text class="yardText" x="300" y="338" font-size="20">Courtyard</text>
      <text class="yardText" x="300" y="360" font-size="13" style="fill:#a8a6bd">Teleportation Station</text>
      ${plots}</svg></div>
    <div class="panel">
      <div class="eyebrow">Rooms</div>
      <div class="roomList">
        <button type="button" data-yard="1"><span>Courtyard<br><small>Bruxanna and Wexler, at the Teleportation Station</small></span></button>
        ${built.map(r => `<button type="button" data-id="${r.id}"><span>${r.name}<br><small>${PEOPLE[r.who].name === "The Barracks" ? "Rest, your chest, the mirror" : PEOPLE[r.who].name}</small></span>${r.game ? '<span class="tag">Minigame</span>' : ""}</button>`).join("")}
        ${toBuild.map(r => `<button type="button" data-id="${r.id}"><span>${r.name}<br><small>Ready to build</small></span><span class="tag dim">Build</span></button>`).join("")}
      </div>
      <p class="note" id="plotNote">Open plots wait for new rooms as the story goes on.</p>
      <div class="eyebrow">Journal</div>
      ${S.clues.length ? `<ul class="journal">${S.clues.map(c => `<li>${c}</li>`).join("")}</ul>` : '<p class="note">No clues yet. Some answers add one.</p>'}
      ${Object.keys(S.warm).length ? `<div class="eyebrow">Warmed to you</div><p class="warm">${Object.keys(S.warm).map(w => PEOPLE[w].name).join(", ")}</p>` : ""}
    </div></div>`;
  const go = id => { const r = room(id), st = plotState(r); if (st === "open") { $("#plotNote").textContent = r.cost ? `${r.name}: build the ${room(r.needs).name} first.` : r.text; return; } showRoom(id); };
  $("#view").querySelectorAll("[data-id]").forEach(el => {
    el.addEventListener("click", () => go(el.dataset.id));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(el.dataset.id); } });
  });
  const yard = () => openTalk(S.met.bruxanna && !S.met.wexler ? "wexler" : "bruxanna");
  $("#yardBtn").addEventListener("click", yard);

  $("[data-yard]").addEventListener("click", showCourtyard);

function showCourtyard() {

    </div></div></div>`;
  $("#tb").onclick = () => openTalk("bruxanna"); $("#tw").onclick = () => openTalk("wexler"); $("#back").onclick = showHub;

/* ---------- room view, with the build step for unbuilt rooms */
const GAME_NAME = { dig: "Dig the rubble", farm: "Tend the plots", kitchen: "Cook a dish" };
function showRoom(id) {
  stopGame();
  const r = room(id), st = plotState(r);
  if (st === "buildable") return showBuild(r);
  const who = r.who;
  $("#view").innerHTML = `<div class="panel"><div class="eyebrow">Castle Comet</div>
    <div class="room">${portrait(who, 120)}
      <div style="display:grid;gap:10px;min-width:0"><h2>${r.name}</h2><p>${r.text}</p>${S.warm[who] ? `<p class="warm">${PERKS[who]}</p>` : ""}
        <div class="btns">
          ${who === "you" ? '<button class="btn primary" type="button" id="rest">Rest a night</button>' : ""}
          <button class="btn" type="button" id="talk">${who === "you" ? "Look around" : "Talk to " + PEOPLE[who].name}</button>
          ${r.game ? `<button class="btn primary" type="button" id="play">${GAME_NAME[r.game]}</button>` : ""}
          <button class="btn" type="button" id="back">Back to the castle</button>
        </div></div></div></div>`;
  $("#talk").onclick = () => openTalk(r.talk || who);
  if ($("#rest")) $("#rest").onclick = rest;
  if (r.game) $("#play").onclick = () => startGame(r.game);
  $("#back").onclick = showHub;
  const tk = r.talk || who;
  if (!S.met[tk] && who !== "you") openTalk(tk);
}
function showBuild(r) {
  const ok = canAfford(r.cost);
  $("#view").innerHTML = `<div class="panel"><div class="eyebrow">Open plot</div>
    <h2>Build the ${r.name}</h2><p class="note" style="max-width:62ch">${r.text}</p>
    <div class="eyebrow">The castle needs</div>
    <div class="cost">${Object.entries(r.cost).map(([k, v]) => `<span class="${S[k] >= v ? "ok" : "short"}">${MAT[k]} ${Math.min(S[k], v)}/${v}</span>`).join("")}</div>
    <p class="note">${ok ? "You have everything. Open the doors and the castle will form the room." : "Dig in the Scrap Yard for what's missing."}</p>
    <div class="btns"><button class="btn primary" type="button" id="build" ${ok ? "" : "disabled"}>Open the doors</button>
      ${ok ? "" : '<button class="btn" type="button" id="toScrap">Go to the Scrap Yard</button>'}
      <button class="btn" type="button" id="back">Back to the castle</button></div>
    <div class="result" id="res"></div></div>`;
  $("#back").onclick = showHub;
  if ($("#toScrap")) $("#toScrap").onclick = () => showRoom("scrap");
  $("#build").onclick = () => {
    Object.entries(r.cost).forEach(([k, v]) => S[k] -= v);
    S.built[r.id] = true; save();
    $("#build").disabled = true;
    $("#res").innerHTML = `<p>You set the ${Object.keys(r.cost).map(k => MAT[k].toLowerCase()).join(" and ")} at the doors and pull them open. The bare stone shimmers, and the ${r.name} forms in front of you.</p><button class="btn primary" type="button" id="enter">Step inside</button>`;
    $("#enter").onclick = () => showRoom(r.id);
    toast(`The ${r.name} is built!`);
  };
}

/* ---------- minigames */
let raf = null, timers = [];
function stopGame() { cancelAnimationFrame(raf); raf = null; timers.forEach(clearInterval); timers = []; document.onkeydown = null; document.onkeyup = null; }
function gameShell(id, title, body) {
  const r = room(id);
  $("#view").innerHTML = `<div class="panel game"><div class="head"><div><div class="eyebrow">${r.name}</div><h2>${title}</h2></div>
    <button class="btn" type="button" id="leave">Back to the ${r.name}</button></div>${body}</div>`;
  $("#leave").onclick = () => showRoom(id);
}
function startGame(k) { stopGame(); ({ dig, farm, kitchen })[k](); }
function dieHTML(v) { return `<span class="d20 ${v === 20 ? "crit" : v === 1 ? "low" : ""}" aria-label="D20 rolled ${v}">${v}</span>`; }
function rollAnim(el, final, done) {
  if (reduce) { el.innerHTML = dieHTML(final); return done(); }
  let k = 0; const t = setInterval(() => { el.innerHTML = dieHTML(k++ < 9 ? d20() : final); if (k > 9) { clearInterval(t); done(); } }, 70); timers.push(t);
}
function hexPts(x, y, size) { return [...Array(6)].map((_, i) => { const a = Math.PI / 180 * (60 * i - 30); return `${(x + size * Math.cos(a)).toFixed(1)},${(y + size * Math.sin(a)).toFixed(1)}`; }).join(" "); }

/* Scrap Yard: hot and cold digging in the rubble, then a D20 for the find */
function dig() {
  const COLS = 7, ROWS = 5, DIGS = S.warm.shnee ? 7 : 6, size = 34, w = Math.sqrt(3) * size;
  const target = [Math.floor(Math.random() * COLS), Math.floor(Math.random() * ROWS)];
  const cube = (c, r) => { const q = c - (r - (r & 1)) / 2; return [q, r, -q - r]; };
  const dist = (a, b) => { const A = cube(...a), B = cube(...b); return Math.max(Math.abs(A[0] - B[0]), Math.abs(A[1] - B[1]), Math.abs(A[2] - B[2])); };
  let left = DIGS, over = false, cells = "";
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const x = w * (c + 0.5 * (r & 1)) + w / 2 + 6, y = size * 1.5 * r + size + 6;
    cells += `<g data-c="${c}" data-r="${r}"><polygon class="hex" points="${hexPts(x, y, size)}" tabindex="0" role="button" aria-label="Dig here"/><text class="hexT" x="${x}" y="${y}"></text></g>`;
  }
  const W = w * (COLS + 0.5) + 12, H = size * 1.5 * (ROWS - 1) + size * 2 + 12;
  gameShell("scrap", "Dig the rubble", `
    <p class="note">Tap a patch to dig. Shnee calls out how close you are: <b>...</b> is cold, <b>?</b> is warmer, <b>!!!</b> is right next to it. You have ${DIGS} digs.</p>
    <div class="stat">Digs left: <b id="left">${left}</b></div>
    <div class="hexWrap"><svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" id="yard" aria-label="Rubble patch">${cells}</svg></div>
    <div class="result" id="res"></div>`);
  const finish = found => {
    over = true; const roll = d20(), total = Math.min(20, roll + (found ? 6 : 0));
    $("#res").innerHTML = `<span id="die"></span><p id="out">${found ? "You found the cache! D20 + 6" : "Out of digs. You sift what you turned up: D20"}...</p>`;
    rollAnim($("#die"), roll, () => {
      let get;
      if (roll === 20) { S.shards++; S.scrap += 2; get = "a <b>Crit Shard</b> and <b>2 Scrap</b>"; }
      else if (total >= 18) { S.lyr++; S.stone += 2; S.timber++; get = "<b>Lyr Dust</b>, <b>2 Stone</b> and <b>1 Timber</b>"; }
      else if (total >= 15) { const sd = pick(Object.keys(CROP)); S.seeds[sd] += 2; S.timber += 2; get = `<b>2 Timber</b> and an old pouch of <b>2 ${CROP[sd].name} seeds</b>`; }
      else if (total >= 11) { S.scrap++; S.stone++; S.timber++; get = "<b>1 Scrap</b>, <b>1 Stone</b> and <b>1 Timber</b>"; }
      else if (total >= 6) { S.scrap += 2; S.stone++; get = "<b>2 Scrap</b> and <b>1 Stone</b>"; }
      else { S.scrap += 2; get = "<b>2 Scrap</b>"; }
      save();
      $("#out").innerHTML = `You rolled ${roll}${found ? `, total ${total}` : ""}. You get ${get}.<br><span class="btns" style="margin-top:8px"><button class="btn" type="button" id="again">Dig again</button><button class="btn" type="button" id="home">Back to the castle</button></span>`;
      $("#again").onclick = dig; $("#home").onclick = showHub;
    });
  };
  const tryDig = g => {
    if (over) return; const poly = g.querySelector("polygon"); if (poly.classList.contains("dug")) return;
    const c = +g.dataset.c, r = +g.dataset.r, d = dist([c, r], target), t = g.querySelector("text");
    left--; $("#left").textContent = left;
    if (d === 0) { poly.classList.add("found"); t.textContent = "★"; t.classList.add("warmT"); return finish(true); }
    poly.classList.add("dug");
    if (d === 1) { t.textContent = "!!!"; t.classList.add("hot"); } else if (d === 2) { t.textContent = "?"; t.classList.add("warmT"); } else { t.textContent = "..."; t.classList.add("far"); }
    poly.setAttribute("aria-label", d === 1 ? "Right next to it" : d === 2 ? "Warmer" : "Cold");
    if (left === 0) finish(false);
  };
  $("#yard").querySelectorAll("g[data-c]").forEach(g => {
    g.addEventListener("click", () => tryDig(g));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tryDig(g); } });
  });
}

/* Farm: plant on hex plots beside a stream, water the dry ones, rest, then harvest with a D20 */
const FARM_LAYOUT = (() => { // pointy-top hexes: a stream row on top, plots below
  const size = 38, w = Math.sqrt(3) * size, cells = [];
  for (let c = 0; c < 6; c++) cells.push({ x: w * c + w / 2 + 6, y: size + 6, water: true });
  for (let c = 0; c < 5; c++) cells.push({ x: w * (c + 0.5) + w / 2 + 6, y: size * 2.5 + 6, stream: true });
  for (let c = 0; c < 6; c++) cells.push({ x: w * c + w / 2 + 6, y: size * 4 + 6 });
  return { size, w, cells, W: w * 6 + 12, H: size * 5 + 12 };
})();
function farm() {
  const L = FARM_LAYOUT, plotCells = L.cells.filter(c => !c.water);
  while (S.plots.length < plotCells.length) S.plots.push(null);
  let seed = Object.keys(CROP).find(k => S.seeds[k] > 0) || null;
  gameShell("farm", "Tend the plots", `
    <p class="note">Pick a seed and tap an empty plot to plant. The row beside the stream waters itself. The far row needs a bucket each day (tap a planted plot). Rest a night in the Barracks to let things grow. When a plot glows gold, tap it to harvest.</p>
    <div class="seeds" id="seeds"></div>
    <div class="stat">Day <b>${S.day}</b> &nbsp; Buckets left today: <b id="bk">${S.buckets}</b></div>
    <div class="hexWrap"><svg viewBox="0 0 ${L.W.toFixed(0)} ${L.H.toFixed(0)}" id="field" aria-label="Farm plots"></svg></div>
    <div class="btns"><button class="btn" type="button" id="restBtn">Rest a night</button></div>
    <div class="result" id="res"></div>`);
  const drawSeeds = () => {
    $("#seeds").innerHTML = Object.entries(CROP).map(([k, c]) => `<button type="button" data-k="${k}" aria-pressed="${seed === k}" ${S.seeds[k] ? "" : "disabled"}><span class="sw" style="background:${c.color}"></span>${c.name} seeds <b>${S.seeds[k]}</b></button>`).join("")
      + `<span class="stat" style="align-self:center">Grows in: Jeewa 2 nights, Charbean and Mint 1 night</span>`;
    $("#seeds").querySelectorAll("button").forEach(b => b.onclick = () => { seed = b.dataset.k; drawSeeds(); });
  };
  const draw = () => {
    let html = "", pi = 0;
    L.cells.forEach(c => {
      if (c.water) { html += `<polygon class="hex water" points="${hexPts(c.x, c.y, L.size)}"/>`; return; }
      const i = pi++, p = S.plots[i];
      const cls = !p ? "soil" : p.ready ? "soil ready" : (p.watered || c.stream) ? "soil watered" : "soil";
      const label = !p ? "" : p.ready ? `${CROP[p.crop].name}!` : `${CROP[p.crop].name}`;
      const sub = !p ? (c.stream ? "stream" : "dry") : p.ready ? "harvest" : (c.stream || p.watered) ? "growing" : "thirsty";
      html += `<g data-i="${i}" tabindex="0" role="button" aria-label="Plot ${i + 1}: ${label || "empty"}, ${sub}"><polygon class="hex ${cls}" points="${hexPts(c.x, c.y, L.size)}"/>
        ${p ? `<circle cx="${c.x}" cy="${c.y - 12}" r="${p.ready ? 9 : 6}" fill="${CROP[p.crop].color}"/>` : ""}
        <text class="hexT small" x="${c.x}" y="${c.y + 8}">${label}</text><text class="hexT small far" x="${c.x}" y="${c.y + 22}" style="font-size:11px">${sub}</text></g>`;
    });
    $("#field").innerHTML = html;
    $("#field").querySelectorAll("g[data-i]").forEach(g => {
      g.addEventListener("click", () => tap(+g.dataset.i));
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tap(+g.dataset.i); } });
    });
  };
  const tap = i => {
    const p = S.plots[i], stream = plotCells[i].stream;
    if (!p) {
      if (!seed || !S.seeds[seed]) { $("#res").innerHTML = "<p>You're out of that seed. The Scrap Yard's old supply crates sometimes have more.</p>"; return; }
      S.seeds[seed]--; S.plots[i] = { crop: seed, nights: 0, wet: 0, watered: false, stream, ready: false };
      if (!S.seeds[seed]) seed = Object.keys(CROP).find(k => S.seeds[k] > 0) || null;
      save(); drawSeeds(); draw(); return;
    }
    if (p.ready) return harvest(i);
    if (stream || p.watered) { $("#res").innerHTML = `<p>The ${CROP[p.crop].name} is growing. Rest a night to help it along.</p>`; return; }
    if (S.buckets < 1) { $("#res").innerHTML = "<p>No buckets left today. Rest a night and the well refills.</p>"; return; }
    S.buckets--; p.watered = true; $("#bk").textContent = S.buckets; save(); draw();
  };
  const harvest = i => {
    const p = S.plots[i], wellFed = p.wet >= CROP[p.crop].nights, bonus = (wellFed ? 4 : 0) + (S.warm.faux ? 2 : 0), roll = d20(), total = roll + bonus;
    $("#res").innerHTML = `<span id="die"></span><p id="out">Harvest roll: D20${bonus ? ` + ${bonus}` : ""}${wellFed ? " (well watered)" : " (it went thirsty)"}...</p>`;
    rollAnim($("#die"), roll, () => {
      let n = roll === 1 ? 0 : total >= 20 ? 4 : total >= 15 ? 3 : total >= 9 ? 2 : 1;
      const back = total >= 10 ? 1 : 0;
      S.crops[p.crop] += n; S.seeds[p.crop] += back; S.plots[i] = null; save();
      $("#out").innerHTML = roll === 1 ? `A natural 1. A plague gremlin got there first and the plot is bare. Faux sighs and hands you a sympathetic leaf.`
        : `You rolled ${roll}${bonus ? `, total ${total}` : ""}. You pick <b>${n} ${CROP[p.crop].name}</b>${back ? " and save <b>1 seed</b>" : ""}.${roll === 20 ? " A natural 20, a golden harvest!" : ""}`;
      drawSeeds(); draw();
    });
  };
  $("#restBtn").onclick = () => { rest(); farm(); };
  drawSeeds(); draw();
}

/* Kitchen: pick a recipe, keep the heat in the green band, stir on cue, then a D20 taste check */
const RECIPES = [
  { id: "tea", name: "Mint Tea", needs: { mint: 1 }, effect: "restores 1D6 Life on Talus" },
  { id: "soup", name: "Charbean Soup", needs: { charbean: 2, mint: 1 }, effect: "restores 2D6 Life on Talus" },
  { id: "tart", name: "Jeewa Tart", needs: { jeewa: 2 }, effect: "+1 Speed for your next battle" },
  { id: "stew", name: "Hearty Comet Stew", needs: { jeewa: 1, charbean: 2, mint: 1 }, effect: "+3 Max Life for your next quest" }
];
function kitchen() {
  const can = r => Object.entries(r.needs).every(([k, v]) => S.crops[k] >= v);
  const have = Object.entries(S.crops).map(([k, v]) => `${CROP[k].name} ${v}`).join(", ");
  gameShell("kitchen", "Cook a dish", `
    <p class="note">You have: ${have}. Pick a recipe.</p>
    <div class="recipes">${RECIPES.map(r => `<button type="button" data-r="${r.id}" ${can(r) ? "" : "disabled"}><b>${r.name}</b><small>${Object.entries(r.needs).map(([k, v]) => `${v} ${CROP[k].name}`).join(", ")}</small><small>${r.effect}</small></button>`).join("")}</div>
    ${RECIPES.some(can) ? "" : '<p class="note">Nothing to cook yet. Grow some crops on the Farm first.</p>'}
    <div id="cook"></div>`);
  $("#view").querySelectorAll("[data-r]").forEach(b => b.onclick = () => cook(RECIPES.find(r => r.id === b.dataset.r)));
}
function cook(rec) {
  Object.entries(rec.needs).forEach(([k, v]) => S.crops[k] -= v); save();
  $("#view").querySelectorAll("[data-r]").forEach(b => b.disabled = true);
  $("#cook").innerHTML = `<div class="game">
    <h3 style="font-size:1.1rem">${rec.name}</h3>
    <p class="note">Hold <b>Bellows</b> (or the space bar) to raise the heat, let go to cool. Keep the marker in the green band. When Bruxanna shouts <b>Stir!</b>, tap Stir quickly.</p>
    <div class="heat"><div class="zone" id="zone"></div><div class="marker" id="mk"></div></div>
    <div class="stirCue" id="cue" aria-live="polite"></div>
    <div class="btns"><button class="btn primary" type="button" id="bellows">Bellows</button><button class="btn" type="button" id="stir">Stir</button></div>
    <div class="stat">Time: <b id="secs">15.0</b>s &nbsp; In the green: <b id="pct">0</b>% &nbsp; Stirs: <b id="stirs">0</b></div>
    <div class="result" id="res"></div></div>`;
  let heat = 20, hold = false, zc = 50, zDir = 1, inZone = 0, ticks = 0, stirs = 0, stirMiss = 0, cueAt = 0, cueOn = false, endAt = performance.now() + 15000, nextCue = performance.now() + 2500, last = performance.now();
  const zw = 22, mk = $("#mk"), zone = $("#zone");
  const press = v => { hold = v; };
  const bl = $("#bellows");
  bl.addEventListener("pointerdown", e => { e.preventDefault(); press(true); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => bl.addEventListener(ev, () => press(false)));
  document.onkeydown = e => { if (e.key === " " && $("#dlgBack").hidden) { e.preventDefault(); press(true); } };
  document.onkeyup = e => { if (e.key === " ") press(false); };
  $("#stir").onclick = () => { if (cueOn) { stirs++; cueOn = false; $("#stirs").textContent = stirs; $("#cue").innerHTML = "Nice stir!"; } };
  const step = t => {
    const dt = Math.min(40, t - last) / 1000; last = t;
    heat += (hold ? 55 : -38) * dt; heat = Math.max(0, Math.min(100, heat));
    zc += zDir * 7 * dt; if (zc > 70) zDir = -1; if (zc < 32) zDir = 1;
    zone.style.left = (zc - zw / 2) + "%"; zone.style.width = zw + "%"; mk.style.left = heat + "%";
    ticks++; if (Math.abs(heat - zc) <= zw / 2) inZone++;
    $("#pct").textContent = Math.round(inZone / ticks * 100);
    if (!cueOn && t > nextCue) { cueOn = true; cueAt = t; $("#cue").innerHTML = "<b>Stir!</b>"; }
    if (cueOn && t - cueAt > 1300) { cueOn = false; stirMiss++; $("#cue").textContent = "Missed the stir."; nextCue = t + 1800 + Math.random() * 1800; }
    const left = Math.max(0, endAt - t); $("#secs").textContent = (left / 1000).toFixed(1);
    if (left <= 0) return finish();
    raf = requestAnimationFrame(step);
  };
  const origStir = $("#stir").onclick;
  $("#stir").onclick = () => { const was = cueOn; origStir(); if (was) nextCue = performance.now() + 1800 + Math.random() * 1800; };
  const finish = () => {
    cancelAnimationFrame(raf); raf = null; document.onkeydown = null; document.onkeyup = null;
    $("#bellows").disabled = true; $("#stir").disabled = true; $("#cue").textContent = "";
    const pct = Math.round(inZone / ticks * 100), bonus = Math.round(pct / 10) + stirs * 2 - stirMiss, roll = d20(), total = roll + bonus;
    $("#res").innerHTML = `<span id="die"></span><p id="out">Taste check: D20 + ${bonus} (${pct}% in the green, ${stirs} stirs${stirMiss ? `, ${stirMiss} missed` : ""})...</p>`;
    rollAnim($("#die"), roll, () => {
      const q = roll === 20 ? "Legendary" : roll === 1 || total < 8 ? "Burnt" : total >= 22 ? "Delicious" : total >= 15 ? "Tasty" : "Plain";
      let msg = `You rolled ${roll}, total ${total}. `;
      if (q === "Burnt") msg += `The ${rec.name} is burnt. Bruxanna eats it anyway. "Still better than paste!"`;
      else {
        S.dishes.push(`${q} ${rec.name}`);
        msg += `You made a <b>${q} ${rec.name}</b> (${rec.effect}${q === "Delicious" || q === "Legendary" ? ", plus a little extra" : ""}). It is in your Barracks chest.`;
        if (!S.met.firstMeal) { S.met.firstMeal = true; msg += ` Bruxanna takes one bite and has to sit down. "FLAVOR!"`; }
      }
      save();
      $("#out").innerHTML = msg + `<br><span class="btns" style="margin-top:8px"><button class="btn" type="button" id="again">Cook another</button><button class="btn" type="button" id="home">Back to the castle</button></span>`;
      $("#again").onclick = kitchen; $("#home").onclick = showHub;
    });
  };
  raf = requestAnimationFrame(step);
}

/* ---------- starfield (gentle; still when reduced motion) */
(() => {
  const cv = $("#stars"), cx = cv.getContext("2d"); let stars = [];
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; stars = [...Array(Math.round(innerWidth * innerHeight / 5000))].map(() => [Math.random() * cv.width, Math.random() * cv.height, Math.random() * 1.4 + .3, Math.random() * 6]); };
  const draw = t => { cx.clearRect(0, 0, cv.width, cv.height); for (const [x, y, r, p] of stars) { cx.globalAlpha = .35 + .4 * Math.sin(t / 1400 + p) ** 2; cx.fillStyle = "#ede7d6"; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); } if (!reduce) requestAnimationFrame(draw); };
  addEventListener("resize", size); size(); requestAnimationFrame(draw);
})();

renderPouch();
renderStyle();
$("#styleChip").onclick = () => { afterStyle = null; votes = []; openTalk("narrator", S.style ? "change" : "q1"); };
showHub();
</script>
